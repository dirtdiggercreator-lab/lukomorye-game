<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лукоморье: Наследие</title>
    <style>
        body { font-family: monospace; background: #2c3e50; color: #ecf0f1; padding: 5px; margin: 0; touch-action: manipulation; }
        .panel { background: #34495e; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        button { background: #e67e22; color: white; border: none; padding: 12px; margin: 2px; border-radius: 5px; font-family: monospace; cursor: pointer; font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 5px;}
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: monospace; }
        
        .grid-mock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-bottom: 10px; }
        .cell-mock { background: #27ae60; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #000; border-radius: 4px; }
        .cell-mock.mountain { background: #7f8c8d; }
        .cell-mock.water { background: #2980b9; }
        .cell-mock.base { background: #8e44ad; }

        .build-panel { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 10px; }
        .build-btn { width: 60px; height: 60px; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #d35400; border-radius: 8px; border: 2px solid #a04000; }

        .spinner-mock { width: 100px; height: 100px; border-radius: 50%; background: conic-gradient(#e74c3c 0deg 90deg, #3498db 90deg 180deg, #2ecc71 180deg 270deg, #f1c40f 270deg 360deg); margin: 0 auto; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; position: relative; }
        .spinner-arrow { position: absolute; top: -10px; font-size: 24px; color: #fff; text-shadow: 0 0 5px #000;}

        .combat-mock { display: flex; justify-content: space-around; align-items: center; background: #1a252f; padding: 15px; border-radius: 8px; border: 2px solid #c0392b; }
        .fighter { text-align: center; }
        .fighter-icon { font-size: 50px; }
        .hp-bar { background: #e74c3c; height: 10px; width: 80px; border-radius: 5px; margin-top: 5px; }
        .hp-bar-inner { background: #2ecc71; height: 100%; border-radius: 5px; width: 100%; }

        .upload-status { font-size: 12px; margin-top: 10px; color: #f1c40f; word-break: break-all;}
    </style>
</head>
<body>

<div class="panel" id="start-screen">
    <h2>Лукоморье: Наследие</h2>
    <p>Прототип (v3.2).</p>
    <button onclick="initGame()">Начать новую партию (Игра)</button>
    <button onclick="showMockup()" style="background:#8e44ad;">Тест визуала (Макет)</button>
    <button onclick="requestUpload()" style="background:#2980b9;">Загрузить картинки в репозиторий</button>
    <button onclick="downloadLogs()">Скачать все логи (JSON)</button>
    <p id="log-count"></p>
</div>

<div id="upload-screen" style="display:none;">
    <div class="panel">
        <h3>Загрузка файлов</h3>
        <div id="token-section">
            <p style="font-size:12px;">Введите ваш GitHub Token (Personal Access Token):</p>
            <input type="password" id="token-input" placeholder="ghp_...">
            <button onclick="saveToken()" style="background:#27ae60;">Сохранить токен</button>
        </div>

        <div id="upload-section" style="display:none;">
            <p style="font-size:12px;">Выберите картинки (можно несколько):</p>
            <input type="file" id="file-input" multiple accept="image/*" style="margin-bottom:10px;">
            <button onclick="uploadFiles()" style="background:#d35400;">Загрузить в GitHub</button>
            <div class="upload-status" id="upload-status"></div>
        </div>
        <button onclick="backToMenu()" style="background:#c0392b; margin-top:20px;">Назад в меню</button>
    </div>
</div>

<div id="mockup-screen" style="display:none;">
    <div class="panel">
        <h3 style="margin:0 0 10px 0; text-align:center; color:#f1c40f;">Макет интерфейса</h3>
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
            <span>❤️ HP: 10/10</span>
            <span>⚡ Действия: 3</span>
            <span>🌲 0 🪨 0 🥩 2 ⛏️ 0</span>
        </div>
        <div class="grid-mock" id="mock-grid"></div>
        <div style="margin-bottom: 15px;">
            <div class="spinner-mock"><div class="spinner-arrow">▼</div></div>
            <p style="text-align:center; font-size:12px; margin-top:5px;">Колесо событий (визуал)</p>
        </div>
        <p style="text-align:center; font-size:12px; margin:0;">Постройки:</p>
        <div class="build-panel">
            <div class="build-btn" onclick="alert('Стена')"><span>🪵</span>Стена</div>
            <div class="build-btn" onclick="alert('Ловушка')"><span>🕳️</span>Ловушка</div>
            <div class="build-btn" onclick="alert('Поле')"><span>🌾</span>Поле</div>
        </div>
        <div class="combat-mock">
            <div class="fighter"><div class="fighter-icon">🧑‍🌾🛡️</div><div>Вы</div><div class="hp-bar"><div class="hp-bar-inner" style="width: 70%;"></div></div></div>
            <div style="font-size:24px; font-weight:bold;">VS</div>
            <div class="fighter"><div class="fighter-icon">🐺</div><div>Волк</div><div class="hp-bar"><div class="hp-bar-inner" style="width: 50%; background:#e74c3c;"></div></div></div>
        </div>
        <button onclick="backToMenu()" style="width:100%; margin-top:15px; background:#c0392b;">Назад в меню</button>
    </div>
</div>

<script>
let allMatchLogs = JSON.parse(localStorage.getItem('lukomorye_logs') || '[]');
function updateLogCount() {
    document.getElementById('log-count').innerText = 'Сохранено партий: ' + allMatchLogs.length;
}
updateLogCount();
function downloadLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allMatchLogs, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "lukomorye_test_logs.json");
    dlAnchorElem.click();
}

function requestUpload() {
    let pin = prompt("Введите PIN-код для доступа:");
    if (pin === "1337") {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('upload-screen').style.display = 'block';
        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) {
            document.getElementById('token-section').style.display = 'none';
            document.getElementById('upload-section').style.display = 'block';
        } else {
            document.getElementById('token-section').style.display = 'block';
            document.getElementById('upload-section').style.display = 'none';
        }
    } else if (pin !== null) {
        alert("Неверный PIN-код!");
    }
}

function saveToken() {
    const token = document.getElementById('token-input').value.trim();
    if (token.startsWith('ghp_')) {
        localStorage.setItem('gh_token', token);
        document.getElementById('token-section').style.display = 'none';
        document.getElementById('upload-section').style.display = 'block';
    } else {
        alert("Токен должен начинаться с 'ghp_'");
    }
}

async function uploadFiles() {
    const fileInput = document.getElementById('file-input');
    const statusDiv = document.getElementById('upload-status');
    const token = localStorage.getItem('gh_token');
    
    if (!fileInput.files.length) {
        alert("Выберите хотя бы один файл!");
        return;
    }

    const owner = "dirtdiggercreator-lab";
    const repo = "lukomorye-game";
    const branch = "master";
    statusDiv.innerHTML = "Начинаю загрузку...";

    for (let i = 0; i < fileInput.files.length; i++) {
        const file = fileInput.files[i];
        statusDiv.innerHTML += '<br>Загрузка: ' + file.name + '...';
        const reader = new FileReader();
        
        reader.onload = async function(e) {
            const base64Data = e.target.result.split(',')[1];
            const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + file.name;
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + token,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Upload ' + file.name + ' via web interface',
                        content: base64Data,
                        branch: branch
                    })
                });

                if (response.ok) {
                    statusDiv.innerHTML += ' ✅ Успешно!';
                } else {
                    const err = await response.json();
                    statusDiv.innerHTML += ' ❌ Ошибка: ' + err.message;
                }
            } catch (error) {
                statusDiv.innerHTML += ' ❌ Сеть: ' + error.message;
            }
        };
        reader.readAsDataURL(file);
    }
}

function showMockup() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('mockup-screen').style.display = 'block';
    generateMockGrid();
}
function generateMockGrid() {
    const grid = document.getElementById('mock-grid');
    grid.innerHTML = '';
    for (let y = 0; y < 6; y++) {
        for (let x = 0; x < 6; x++) {
            let type = 'forest'; let icon = '🌲';
            if (x === 2 && y === 2) { type = 'base'; icon = '🏕️'; }
            else if ((x+y)%3 === 0) { type = 'mountain'; icon = '⛰️'; }
            else if ((x*y)%4 === 0) { type = 'water'; icon = '🌊'; }
            const d = document.createElement('div');
            d.className = 'cell-mock ' + type;
            d.innerText = icon;
            grid.appendChild(d);
        }
    }
}

function backToMenu() {
    document.getElementById('mockup-screen').style.display = 'none';
    document.getElementById('upload-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
}

function initGame() {
    alert("Игровая логика в разработке. Сейчас доступен Тест Визуала и Загрузка картинок.");
}
</script>
</body>
</html>
