<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лукоморье: Наследие</title>
    <style>
        /* Базовые настройки */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e272e; color: #d2dae2; padding: 15px; margin: 0; box-sizing: border-box; touch-action: manipulation; }
        .panel { background: #2f3640; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Кнопки меню */
        .menu-btn { background: #e84118; color: white; border: none; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; text-align: center; }
        .menu-btn:hover { background: #c23616; }
        
        /* Панель характеристик */
        .stats-bar { display: flex; justify-content: space-between; background: #1e272e; padding: 10px 15px; border-radius: 8px; border: 1px solid #485460; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        
        /* Сетка 6х6 */
        .grid-mock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 15px; }
        .cell-mock { background: #4cd137; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; border-radius: 6px; border: 2px solid #353b48; user-select: none; }
        .cell-mock.mountain { background: #7f8c8d; }
        .cell-mock.water { background: #00a8ff; }
        .cell-mock.base { background: #9c88ff; border-color: #fbc531; border-width: 3px; }

        /* Панель строительства */
        .build-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .build-btn { background: #fbc531; color: #1e272e; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; height: 70px; }
        .build-btn span { font-size: 24px; margin-bottom: 4px; }

        /* Макет боя */
        .combat-mock { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; background: #1e272e; padding: 15px; border-radius: 12px; border: 2px solid #e84118; }
        .fighter { background: #2f3640; padding: 10px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .fighter-icon { font-size: 40px; margin-bottom: 5px; }
        .fighter-name { font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .hp-bar-bg { background: #485460; height: 12px; width: 100%; border-radius: 6px; overflow: hidden; }
        .hp-bar-fill { background: #4cd137; height: 100%; width: 70%; }
        .hp-bar-fill.enemy { background: #e84118; width: 50%; }
        .vs-text { font-size: 20px; font-weight: bold; color: #e84118; }

        /* Формы */
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 10px; border-radius: 8px; border: 1px solid #485460; font-size: 14px; background: #1e272e; color: #fff; }
        
        /* Карточка загрузки файла с превью */
        .file-row { display: flex; align-items: center; background: #1e272e; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #485460; gap: 10px; }
        .file-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid #485460; background: #000; }
        .file-info { flex-grow: 1; }
        .file-name { font-size: 12px; color: #718093; margin-bottom: 5px; word-break: break-all; }
        
        .upload-status { font-size: 13px; margin-top: 10px; color: #fbc531; word-break: break-all;}
    </style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="panel" id="start-screen">
    <h2 style="text-align: center; margin-top: 0; color: #fbc531;">Лукоморье: Наследие</h2>
    <p style="text-align: center; font-size: 14px; color: #718093;">Прототип (v3.6)</p>
    <button class="menu-btn" onclick="alert('Игра в разработке')">Начать партию</button>
    <button class="menu-btn" onclick="showMockup()" style="background: #9c88ff;">Тест визуала (Макет)</button>
    <button class="menu-btn" onclick="requestUpload()" style="background: #00a8ff;">Загрузить картинки</button>
    <button class="menu-btn" onclick="downloadLogs()" style="background: #4cd137; color: #1e272e;">Скачать логи (JSON)</button>
    <p id="log-count" style="text-align: center; font-size: 12px; margin-top: 15px;"></p>
</div>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div id="upload-screen" style="display:none;">
    <div class="panel">
        <h3 style="text-align: center; margin-top:0; color: #fbc531;">Загрузка картинок</h3>
        <div id="token-section">
            <p style="font-size:13px; text-align:center;">Введите GitHub Token:</p>
            <input type="password" id="token-input" placeholder="ghp_...">
            <button class="menu-btn" onclick="saveToken()" style="background:#4cd137; color:#1e272e;">Сохранить токен</button>
        </div>

        <div id="upload-section" style="display:none;">
            <p style="font-size:13px; text-align:center;">Выберите картинки (можно несколько):</p>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFileSelect(event)">
            <div id="file-list" style="margin-top: 10px;"></div>
            <button class="menu-btn" onclick="uploadFiles()" style="background:#fbc531; color:#1e272e;" id="btn-upload" disabled>Загрузить в GitHub</button>
            <div class="upload-status" id="upload-status"></div>
        </div>
        <button class="menu-btn" onclick="backToMenu()" style="background:#e84118; margin-top:20px;">Назад</button>
    </div>
</div>

<!-- ТЕСТ ВИЗУАЛА -->
<div id="mockup-screen" style="display:none;">
    <div class="panel">
        <h3 style="text-align: center; margin-top: 0; color: #fbc531;">Макет Интерфейса</h3>
        <div class="stats-bar">
            <div>❤️ 10/10</div>
            <div>⚡ 3</div>
            <div>🌲0 🪨0 🥩2 ⛏️0</div>
        </div>
        <div class="grid-mock" id="mock-grid"></div>
        <p style="text-align: center; font-size: 14px; margin-bottom: 10px; font-weight: bold;">Постройки:</p>
        <div class="build-grid">
            <div class="build-btn" onclick="alert('Стена (2🌲)')"><span>🪵</span>Стена</div>
            <div class="build-btn" onclick="alert('Ловушка (1🌲1🪨)')"><span>🕳️</span>Ловушка</div>
            <div class="build-btn" onclick="alert('Поле (2🌲)')"><span>🌾</span>Поле</div>
            <div class="build-btn" onclick="alert('Лазарет (3🌲2🪨)')"><span>🏥</span>Лазарет</div>
        </div>
        <p style="text-align: center; font-size: 14px; margin-bottom: 10px; font-weight: bold;">Как выглядит бой:</p>
        <div class="combat-mock">
            <div class="fighter">
                <div class="fighter-icon">🧑‍🌾🛡️</div>
                <div class="fighter-name">Вы</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill"></div></div>
            </div>
            <div class="vs-text">VS</div>
            <div class="fighter">
                <div class="fighter-icon">🐺</div>
                <div class="fighter-name">Волк</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill enemy"></div></div>
            </div>
        </div>
        <button class="menu-btn" onclick="backToMenu()" style="background:#e84118; margin-top:20px;">Назад в меню</button>
    </div>
</div>

<script>
// Логи
let allMatchLogs = JSON.parse(localStorage.getItem('lukomorye_logs') || '[]');
document.getElementById('log-count').innerText = 'Сохранено партий: ' + allMatchLogs.length;
function downloadLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allMatchLogs, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "lukomorye_test_logs.json");
    dlAnchorElem.click();
}

// Навигация
function showMockup() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('mockup-screen').style.display = 'block';
    generateMockGrid();
}
function backToMenu() {
    document.getElementById('mockup-screen').style.display = 'none';
    document.getElementById('upload-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
}
function generateMockGrid() {
    const grid = document.getElementById('mock-grid');
    grid.innerHTML = '';
    for (let y = 0; y < 6; y++) {
        for (let x = 0; x < 6; x++) {
            let type = 'forest'; let icon = '🌲';
            if (x === 2 && y === 2) { type = 'base'; icon = '🏕️'; }
            else if ((x+y)%3 === 0) { type = 'mountain'; icon = '⛰️'; }
            else if ((x*y)%4 === 0) { type = 'water'; icon = '🌊'; }
            const d = document.createElement('div');
            d.className = 'cell-mock ' + type;
            d.innerText = icon;
            grid.appendChild(d);
        }
    }
}

// ====== ЗАГРУЗКА С ПРЕВЬЮ ======
function requestUpload() {
    let pin = prompt("Введите PIN-код:");
    if (pin === "1337") {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('upload-screen').style.display = 'block';
        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) {
            document.getElementById('token-section').style.display = 'none';
            document.getElementById('upload-section').style.display = 'block';
        } else {
            document.getElementById('token-section').style.display = 'block';
        }
    } else if (pin !== null) alert("Неверный PIN!");
}

function saveToken() {
    const token = document.getElementById('token-input').value.trim();
    if (token.startsWith('ghp_')) {
        localStorage.setItem('gh_token', token);
        document.getElementById('token-section').style.display = 'none';
        document.getElementById('upload-section').style.display = 'block';
    } else alert("Токен должен начинаться с 'ghp_'");
}

let selectedFiles = [];
function handleFileSelect(event) {
    selectedFiles = Array.from(event.target.files);
    const listDiv = document.getElementById('file-list');
    listDiv.innerHTML = '';
    document.getElementById('btn-upload').disabled = false;

    const predefinedNames = [
        { value: 'forest.jpg', label: 'Лес (forest.jpg)' },
        { value: 'mountain.jpg', label: 'Горы (mountain.jpg)' },
        { value: 'water.jpg', label: 'Вода (water.jpg)' },
        { value: 'base.jpg', label: 'База (base.jpg)' },
        { value: 'wolf.jpg', label: 'Волк (wolf.jpg)' },
        { value: 'bear.jpg', label: 'Медведь (bear.jpg)' },
        { value: 'robber.jpg', label: 'Разбойник (robber.jpg)' }
    ];

    selectedFiles.forEach((file, index) => {
        // Создаем превью картинки прямо из памяти телефона
        const previewURL = URL.createObjectURL(file);
        
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `
            <img src="${previewURL}" class="file-preview">
            <div class="file-info">
                <div class="file-name">${file.name}</div>
                <select id="name-select-${index}">
                    <option value="">-- Выберите имя --</option>
                    ${predefinedNames.map(n => `<option value="${n.value}">${n.label}</option>`).join('')}
                    <option value="custom">-- Свое имя --</option>
                </select>
                <input type="text" id="name-input-${index}" placeholder="Свое имя (например, hero.jpg)" style="display:none; margin-bottom:0;">
            </div>
        `;
        listDiv.appendChild(row);
        
        const select = document.getElementById(`name-select-${index}`);
        const input = document.getElementById(`name-input-${index}`);
        select.onchange = () => { input.style.display = select.value === 'custom' ? 'block' : 'none'; };
    });
}

function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 1024;
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = Math.round((maxWidth / width) * height); width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                    const fileReader = new FileReader();
                    fileReader.onloadend = () => resolve(fileReader.result.split(',')[1]);
                    fileReader.readAsDataURL(blob);
                }, 'image/jpeg', 0.75);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

async function uploadFiles() {
    const statusDiv = document.getElementById('upload-status');
    const token = localStorage.getItem('gh_token');
    const btn = document.getElementById('btn-upload');
    
    if (!selectedFiles.length) return;
    btn.disabled = true;
    statusDiv.innerHTML = "Начинаю загрузку...";

    const owner = "dirtdiggercreator-lab";
    const repo = "lukomorye-game";
    const branch = "master";

    for (let i = 0; i < selectedFiles.length; i++) {
        let fileName = document.getElementById(`name-select-${i}`).value;
        if (fileName === 'custom') fileName = document.getElementById(`name-input-${i}`).value.trim();
        if (!fileName) { statusDiv.innerHTML += `<br>❌ ${selectedFiles[i].name}: имя не выбрано.`; continue; }
        if (!fileName.endsWith('.jpg')) fileName += '.jpg';

        statusDiv.innerHTML += `<br>Обработка: ${fileName}...`;
        const base64Data = await compressImage(selectedFiles[i]);
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`;
        
        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Upload ${fileName}`, content: base64Data, branch: branch })
            });
            if (response.ok) statusDiv.innerHTML += ' ✅';
            else { const err = await response.json(); statusDiv.innerHTML += ` ❌ ${err.message}`; }
        } catch (error) { statusDiv.innerHTML += ` ❌ Сеть`; }
    }
    statusDiv.innerHTML += '<br><b>Готово!</b>';
    btn.disabled = false;
}
</script>
</body>
</html>
