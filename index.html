<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лукоморье: Наследие</title>
    <style>
        :root { --bg: #1e272e; --panel: #2f3640; --btn: #d35400; --btn-hover: #e67e22; --text: #d2dae2; --accent: #fbc531; --danger: #e84118; --success: #4cd137; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* Верхняя панель */
        .top-panel { background: #151b20; padding: 5px; display: flex; flex-direction: column; border-bottom: 2px solid #000; z-index: 10; }
        .res-bar { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; padding: 2px 10px; }
        .pawn-bar { display: flex; justify-content: center; gap: 10px; padding: 5px 0; border-top: 1px solid #2f3640; }
        .pawn-icon { font-size: 24px; cursor: pointer; padding: 2px; border-radius: 5px; }
        .pawn-icon.active { background: var(--accent); color: #000; }
        
        /* Игровая зона */
        .game-area { flex-grow: 1; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
        .viewport { width: 100%; height: 100%; max-width: 100vh; max-height: 100vw; overflow: auto; position: relative; }
        .grid { display: grid; grid-template-columns: repeat(15, 1fr); width: 1500px; height: 1500px; } /* 15x15 */
        .cell { background: #27ae60; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 1px solid #000; box-sizing: border-box; cursor: pointer; position: relative; }
        
        /* Ландшафт */
        .cell.forest { background: #2ecc71; }
        .cell.mountain { background: #7f8c8d; }
        .cell.water { background: #2980b9; }
        .cell.base { background: #8e44ad; }
        
        /* Постройки и объекты */
        .cell.wall-wood { background: #8e5a2b; }
        .cell.wall-stone { background: #7f8c8d; border: 2px solid #fff; }
        .cell.trap { background: #555; border: 1px dashed #fff; }
        .cell.ghost { border: 2px solid var(--accent); background: rgba(251, 197, 49, 0.3); }

        /* Нижняя панель */
        .bottom-panel { background: var(--panel); padding: 10px; display: flex; gap: 5px; border-top: 2px solid #000; z-index: 10; }
        .btn { background: var(--btn); color: white; border: none; padding: 12px 5px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .btn:disabled { background: #555; color: #888; }
        .btn-danger { background: var(--danger); }
        
        /* Модалки */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--panel); padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; border: 2px solid var(--btn); max-height: 90vh; overflow-y: auto; }
        
        /* Колесо */
        .wheel { width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(#e84118 0deg 90deg, #00a8ff 90deg 180deg, #4cd137 180deg 270deg, #fbc531 270deg 360deg); margin: 20px auto; border: 4px solid #fff; position: relative; transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1); }
        .wheel-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; color: #fff; text-shadow: 0 2px 5px #000; z-index: 2;}

        /* Карты */
        .card-visual { width: 140px; height: 200px; background: #c0392b; border-radius: 8px; margin: 10px auto; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 3px solid #fff; cursor: pointer; font-size: 14px; padding: 10px; }
        .card-visual.green { background: #27ae60; }
        
        /* Лог */
        .log-box { height: 80px; overflow-y: scroll; background: #000; padding: 5px; font-size: 10px; font-family: monospace; border-radius: 5px; text-align: left; margin-top: 10px; }
    </style>
</head>
<body>

<div class="top-panel" id="top-panel" style="display:none;">
    <div class="res-bar">
        <div>Раунд: <span id="ui-round">1</span> (<span id="ui-season">Весна</span>)</div>
        <div>❤️ <span id="ui-hp">10</span>/<span id="ui-maxhp">10</span></div>
        <div>⚡ <span id="ui-ap">3</span></div>
        <div>🌲<span id="ui-wood">0</span> 🪨<span id="ui-stone">0</span> 🥩<span id="ui-meat">2</span> ⛏️<span id="ui-copper">0</span></div>
    </div>
    <div class="pawn-bar" id="pawn-bar"></div>
</div>

<div class="game-area" id="game-area" style="display:none;">
    <div class="viewport" id="viewport">
        <div class="grid" id="game-grid"></div>
    </div>
</div>

<div class="bottom-panel" id="bottom-panel" style="display:none;">
    <button class="btn" onclick="setMode('move')">Движение</button>
    <button class="btn" onclick="openModal('build-modal')">Стройка</button>
    <button class="btn" onclick="openModal('craft-modal')">Крафт</button>
    <button class="btn" onclick="doAction('gather')">Добыть</button>
    <button class="btn" onclick="sendCaravan()">Караван</button>
    <button class="btn btn-danger" onclick="nextRound()">Ход</button>
</div>

<!-- ЭКРАН СТАРТА -->
<div class="modal" id="start-modal" style="display:flex;">
    <div class="modal-content">
        <h2 style="color: var(--accent); margin-top: 0;">Лукоморье</h2>
        <p>Выберите сложность:</p>
        <button class="btn" onclick="initGame('easy')" style="margin-bottom: 10px; background: #27ae60;">Сказка (Легко)</button>
        <button class="btn" onclick="initGame('normal')" style="margin-bottom: 10px;">Былина (Средне)</button>
        <button class="btn" onclick="initGame('hard')" style="background: #c0392b;">Темное Время (Хардкор)</button>
        <button class="btn" onclick="downloadLogs()" style="background: #00a8ff; margin-top: 20px; font-size: 12px;">Скачать логи</button>
    </div>
</div>

<!-- МОДАЛКА ПЕШКИ -->
<div class="modal" id="pawn-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color: var(--accent);">Карточка пешки</h3>
        <div style="font-size: 40px;" id="p-modal-icon">🧑‍🌾</div>
        <h4 id="p-modal-name" style="font-size: 20px;">Ратмир</h4>
        <div style="text-align: left; font-size: 14px; margin: 15px 0;">
            <div>⚔️ Сила: <span id="p-str">3</span></div>
            <div>🏹 Ловкость: <span id="p-agi">3</span></div>
            <div>🛠️ Ремесло: <span id="p-craft">2</span></div>
            <div>❤️ HP: <span id="p-hp">10</span> / <span id="p-maxhp">10</span></div>
            <div>🎒 Экипировка: <span id="p-equip">Нет</span></div>
        </div>
        <button class="btn" onclick="randomizeName()" style="background: #8e44ad;">Сменить имя (Рандом)</button>
        <button class="btn btn-danger" onclick="closeModal('pawn-modal')" style="margin-top: 10px;">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА КОЛЕСА -->
<div class="modal" id="wheel-modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--accent);">Колесо Событий</h3>
        <div style="position: relative; width: 200px; margin: 0 auto;">
            <div class="wheel-arrow">▼</div>
            <div class="wheel" id="wheel-visual"></div>
        </div>
        <button class="btn" id="btn-spin" onclick="spinWheel()" style="margin-top: 20px;">Крутить!</button>
        <p id="wheel-result" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
</div>

<!-- МОДАЛКА КАРТЫ -->
<div class="modal" id="card-modal">
    <div class="modal-content">
        <h3 id="card-title" style="margin-top: 0;">Событие</h3>
        <div class="card-visual" id="card-visual" onclick="revealCard()">Нажми, чтобы открыть</div>
        <p id="card-text" style="margin-bottom: 15px; font-size: 14px; display: none;"></p>
        <button class="btn" id="btn-close-card" onclick="closeCard()" style="display: none;">Ок</button>
    </div>
</div>

<!-- МОДАЛКА СТРОЙКИ -->
<div class="modal" id="build-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Постройки</h3>
        <button class="btn" onclick="selectBuild('wall_wood')">Дерево (2🌲)</button>
        <button class="btn" onclick="selectBuild('wall_stone')">Камень (2🌲 2🪨)</button>
        <button class="btn" onclick="selectBuild('trap')">Ловушка (1🌲 1🪨)</button>
        <button class="btn" onclick="selectBuild('hearth')">Очаг (3🪨)</button>
        <button class="btn" onclick="selectBuild('barn')">Амбар (2🌲 1🪨)</button>
        <button class="btn btn-danger" onclick="closeModal('build-modal')" style="margin-top: 10px;">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА КРАФТА -->
<div class="modal" id="craft-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Крафт</h3>
        <button class="btn" onclick="craft('spear')">Копье (1⛏️ 1🌲)</button>
        <button class="btn" onclick="craft('axe')">Топор (2⛏️ 1🌲)</button>
        <button class="btn" onclick="craft('armor')">Броня (2🐻 1⛏️)</button>
        <button class="btn btn-danger" onclick="closeModal('craft-modal')" style="margin-top: 10px;">Закрыть</button>
    </div>
</div>

<!-- МОДАЛКА БОЯ -->
<div class="modal" id="combat-modal">
    <div class="modal-content" style="border-color: var(--danger);">
        <h3 style="color: var(--danger); margin-top: 0;">БОЙ!</h3>
        <p>Враг: <span id="c-enemy-name">Волк</span></p>
        <p>HP Врага: <span id="c-enemy-hp">4</span></p>
        <p>Твое HP: <span id="c-player-hp">10</span></p>
        <div class="log-box" id="combat-log" style="height: 80px; margin-bottom: 10px;"></div>
        <button class="btn" onclick="combatAction('attack')">Атаковать</button>
        <button class="btn btn-danger" onclick="combatAction('flee')">Отступить</button>
    </div>
</div>

<script>
// ================== ЛОГИ И УТИЛИТЫ ==================
let allLogs = JSON.parse(localStorage.getItem('logs') || '[]');
let currentLog = { actions: [], result: "in_progress" };
function downloadLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allLogs, null, 2));
    const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "logs.json"); dl.click();
}
function log(msg, isCombat = false) {
    const box = document.getElementById(isCombat ? 'combat-log' : 'log-box');
    if (box) { box.innerHTML += msg + '<br>'; box.scrollTop = box.scrollHeight; }
    if (!isCombat) currentLog.actions.push(`[R${state.round}] ${msg}`);
}
function rollD6() { return Math.floor(Math.random() * 6) + 1; }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// ================== СОСТОЯНИЕ ==================
let state = {};
const names = ["Ратмир", "Ольга", "Илья", "Деяна", "Святозар", "Лада"];

function initGame(difficulty) {
    state = {
        diff: difficulty,
        round: 1, ap: 3,
        maxHp: 10, hp: 10,
        res: { wood: 0, stone: 0, meat: 2, hide: 0, copper: 0 },
        grid: [], enemies: [],
        mode: 'move', buildSelection: null,
        inCombat: false, activeEnemy: null,
        pawns: [{ name: names[Math.floor(Math.random()*names.length)], str: 3, agi: 3, craft: 2, hp: 10, maxHp: 10, equip: null, x: 7, y: 7 }],
        activePawn: 0,
        isAnimating: false
    };
    currentLog = { actions: [], result: "in_progress" };
    
    for (let y = 0; y < 15; y++) {
        let row = [];
        for (let x = 0; x < 15; x++) {
            let type = Math.random() < 0.2 ? "mountain" : Math.random() < 0.15 ? "water" : "forest";
            if (x === 7 && y === 7) type = "base";
            row.push({ type, building: null });
        }
        state.grid.push(row);
    }

    document.getElementById('start-modal').style.display = 'none';
    document.getElementById('top-panel').style.display = 'flex';
    document.getElementById('game-area').style.display = 'flex';
    document.getElementById('bottom-panel').style.display = 'flex';
    
    renderGrid(); updateUI();
    
    // Центрируем камеру на базе
    setTimeout(() => {
        const vp = document.getElementById('viewport');
        vp.scrollLeft = (7 * 100) - (vp.clientWidth / 2);
        vp.scrollTop = (7 * 100) - (vp.clientHeight / 2);
    }, 100);
}

// ================== ОТРИСОВКА ==================
function renderGrid() {
    const gridDiv = document.getElementById('game-grid');
    gridDiv.innerHTML = '';
    for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
            const cell = state.grid[y][x];
            const d = document.createElement('div');
            d.className = `cell ${cell.type}`;
            
            let content = '';
            if (cell.building === 'wall_wood') { d.classList.add('wall-wood'); content = '🧱'; }
            else if (cell.building === 'wall_stone') { d.classList.add('wall-stone'); content = '🪨'; }
            else if (cell.building === 'trap') { d.classList.add('trap'); content = '🕳️'; }
            else if (cell.building === 'hearth') content = '🔥';
            else if (cell.building === 'barn') content = '🏚️';

            let enemyHere = state.enemies.find(e => e.x === x && e.y === y);
            if (enemyHere) content = enemyHere.icon;

            let pawnHere = state.pawns.find(p => p.x === x && p.y === y);
            if (pawnHere) { 
                content = "🧑‍🌾"; 
                if (pawnHere === state.pawns[state.activePawn]) d.classList.add('ghost'); 
            }

            if (!content) content = cell.type === 'forest' ? '🌲' : cell.type === 'mountain' ? '⛰️' : cell.type === 'water' ? '🌊' : '🏕️';

            d.innerText = content;
            d.onclick = () => handleCellClick(x, y);
            gridDiv.appendChild(d);
        }
    }
    renderPawnBar();
}

function renderPawnBar() {
    const bar = document.getElementById('pawn-bar');
    bar.innerHTML = '';
    state.pawns.forEach((p, i) => {
        const d = document.createElement('div');
        d.className = `pawn-icon ${i === state.activePawn ? 'active' : ''}`;
        d.innerText = '🧑‍🌾';
        d.onclick = () => { state.activePawn = i; renderGrid(); openPawnModal(); };
        bar.appendChild(d);
    });
}

function updateUI() {
    document.getElementById('ui-round').innerText = state.round;
    document.getElementById('ui-season').innerText = state.round <= 4 ? "Весна" : state.round <= 8 ? "Лето" : state.round <= 12 ? "Осень" : "Зима";
    let p = state.pawns[state.activePawn];
    document.getElementById('ui-hp').innerText = Math.max(0, p.hp);
    document.getElementById('ui-maxhp').innerText = p.maxHp;
    document.getElementById('ui-ap').innerText = state.ap;
    document.getElementById('ui-wood').innerText = state.res.wood;
    document.getElementById('ui-stone').innerText = state.res.stone;
    document.getElementById('ui-meat').innerText = state.res.meat;
    document.getElementById('ui-copper').innerText = state.res.copper;
}

// ================== ПЕШКИ ==================
function openPawnModal() {
    let p = state.pawns[state.activePawn];
    document.getElementById('p-modal-name').innerText = p.name;
    document.getElementById('p-str').innerText = p.str;
    document.getElementById('p-agi').innerText = p.agi;
    document.getElementById('p-craft').innerText = p.craft;
    document.getElementById('p-hp').innerText = p.hp;
    document.getElementById('p-maxhp').innerText = p.maxHp;
    document.getElementById('p-equip').innerText = p.equip || "Нет";
    openModal('pawn-modal');
}

function randomizeName() {
    let p = state.pawns[state.activePawn];
    p.name = names[Math.floor(Math.random()*names.length)];
    document.getElementById('p-modal-name').innerText = p.name;
}

// ================== ДВИЖЕНИЕ И ВЗАИМОДЕЙСТВИЕ ==================
async function handleCellClick(x, y) {
    if (state.inCombat || state.isAnimating) return;
    
    let p = state.pawns[state.activePawn];
    let dist = Math.abs(p.x - x) + Math.abs(p.y - y);
    
    if (state.mode === 'move') {
        if (dist !== 1) return log("❌ Можно ходить только на соседнюю клетку!");
        if (state.grid[y][x].building || state.enemies.some(e => e.x === x && e.y === y)) return log("❌ Клетка занята!");
        
        state.isAnimating = true;
        let speed = state.grid[y][x].type === 'mountain' ? 300 : state.grid[y][x].type === 'water' ? 500 : 1000;
        
        p.x = x; p.y = y;
        renderGrid();
        await sleep(speed);
        state.isAnimating = false;
        
        if (state.enemies.length > 0) { state.ap--; updateUI(); }
    } 
    else if (state.mode === 'build' && state.buildSelection) {
        if (state.ap <= 0) return log("❌ Нет AP!");
        if (state.grid[y][x].building) return log("❌ Занято!");
        
        let cw = 0, cs = 0;
        if (state.buildSelection === 'wall_wood') cw = 2;
        if (state.buildSelection === 'wall_stone') { cw = 2; cs = 2; }
        if (state.buildSelection === 'trap') { cw = 1; cs = 1; }
        if (state.buildSelection === 'hearth') cs = 3;
        if (state.buildSelection === 'barn') { cw = 2; cs = 1; }

        if (state.res.wood >= cw && state.res.stone >= cs) {
            state.res.wood -= cw; state.res.stone -= cs;
            state.grid[y][x].building = state.buildSelection;
            state.ap--;
            log(`✅ Построено: ${state.buildSelection}`);
            state.mode = 'move'; renderGrid(); updateUI();
        } else log("❌ Не хватает ресурсов!");
    }
}

function setMode(m) { state.mode = m; state.buildSelection = null; log(`Режим: ${m}`); }
function selectBuild(type) { state.buildSelection = type; state.mode = 'build'; closeModal('build-modal'); log("Выбери клетку для постройки."); }

function doAction(type) {
    if (state.ap <= 0) return;
    let p = state.pawns[state.activePawn];
    let cell = state.grid[p.y][p.x];
    
    if (type === 'gather') {
        log(`🎲 Добыча: [${rollD6()}]`);
        if (cell.type === 'forest') { state.res.wood += 2; log("🌲 +2 дерева."); }
        else if (cell.type === 'mountain') { state.res.stone += 2; log("🪨 +2 камня."); }
        else if (cell.type === 'water') { state.res.meat += 2; log("🥩 +2 еды."); }
        else log("Здесь нечего добывать.");
        state.ap--; updateUI();
    }
}

function sendCaravan() {
    if (state.ap < 1 || state.res.meat < 1) return log("❌ Нужно 1 AP и 1 еду.");
    state.ap--; state.res.meat--;
    let r = rollD6();
    if (r <= 2) { state.pawns[state.activePawn].hp -= 1; log("🛡️ Засада! -1 HP"); }
    else if (r <= 4) { state.res.copper += 2; log("🪨 +2 меди"); }
    else { state.res.hide += 2; state.res.meat += 2; log("🏕️ Торговец! +2 шкуры, +2 еды"); }
    updateUI(); renderGrid();
}

// ================== СЛЕД РАУНД И КОЛЕСО ==================
function nextRound() {
    if (state.inCombat) return;
    let p = state.pawns[state.activePawn];
    
    if (state.res.meat >= 1) { state.res.meat--; log("🍖 Съедена 1 еда."); }
    else { p.hp -= 2; log("💀 ГОЛОД! -2 HP."); }
    
    if (state.round > 12 && !state.grid[7][7].building === 'hearth') { p.hp -= 2; log("❄️ ЗИМА! Нет очага на базе. -2 HP."); }
    if (p.hp <= 0) return endGame("Смерть от голода/холода");

    state.round++; state.ap = 3;
    openModal('wheel-modal');
    document.getElementById('btn-spin').style.display = 'block';
    document.getElementById('wheel-result').innerText = '';
    document.getElementById('wheel-visual').style.transform = 'rotate(0deg)';
    
    processEnemyTurns();
    updateUI(); renderGrid();
}

let isSpinning = false;
function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('btn-spin').style.display = 'none';
    let wheel = document.getElementById('wheel-visual');
    wheel.style.transform = `rotate(${1440 + Math.floor(Math.random() * 360)}deg)`;

    setTimeout(() => {
        isSpinning = false;
        let sector = Math.floor(Math.random() * 6);
        let txt = "";
        if (sector === 0) { txt = "🟢 Позитив"; drawCard('positive'); }
        else if (sector === 1) { txt = "🔴 Негатив"; drawCard('negative'); }
        else if (sector === 2) { txt = "🟡 Ресурсы"; state.res.wood += 2; state.res.stone += 2; }
        else if (sector === 3) { txt = "🔵 Погода"; log("Погода изменилась."); }
        else if (sector === 4) { txt = "🟣 Обмен"; log("Духи леса предлагают обмен."); }
        else { txt = "⚫ Рейд!"; spawnEnemy(); }

        document.getElementById('wheel-result').innerText = `Выпало: ${txt}`;
        if (sector !== 0 && sector !== 1) setTimeout(() => closeModal('wheel-modal'), 1500);
    }, 4000);
}

// ================== КАРТЫ ==================
const cardsPos = [{ t: "Удачная охота", d: "+3 еды, +2 шкуры.", f: () => { state.res.meat += 3; state.res.hide += 2; } }];
const cardsNeg = [{ t: "Воры", d: "Потеряно 2 дерева.", f: () => { state.res.wood = Math.max(0, state.res.wood - 2); } }];

function drawCard(type) {
    let card = (type === 'positive' ? cardsPos : cardsNeg)[0];
    document.getElementById('card-title').innerText = type === 'positive' ? "Дары Природы" : "Суровая Земля";
    let vis = document.getElementById('card-visual');
    vis.className = `card-visual ${type === 'positive' ? 'green' : ''}`;
    vis.innerText = "Нажми";
    vis.onclick = () => {
        vis.innerText = card.t;
        document.getElementById('card-text').innerText = card.d;
        document.getElementById('card-text').style.display = 'block';
        document.getElementById('btn-close-card').style.display = 'block';
        card.f(); log(`Карта: ${card.t}`);
    };
    document.getElementById('card-text').style.display = 'none';
    document.getElementById('btn-close-card').style.display = 'none';
    openModal('card-modal');
}
function closeCard() { closeModal('card-modal'); closeModal('wheel-modal'); updateUI(); renderGrid(); }

// ================== ВРАГИ И БОЙ ==================
function spawnEnemy() {
    let side = Math.floor(Math.random() * 4);
    let ex = side === 0 || side === 2 ? Math.floor(Math.random()*15) : (side === 1 ? 14 : 0);
    let ey = side === 0 ? 0 : (side === 2 ? 14 : Math.floor(Math.random()*15));
    state.enemies.push({ icon: '🐺', hp: 4, maxHp: 4, name: 'Волк', agi: 4, x: ex, y: ey });
    log(`⚠️ Появился Волк на [${ex},${ey}]!`);
}

function processEnemyTurns() {
    for (let i = state.enemies.length - 1; i >= 0; i--) {
        let e = state.enemies[i];
        let target = state.pawns[0]; // Для простоты все враги идут к первой пешке
        let dist = Math.abs(target.x - e.x) + Math.abs(target.y - e.y);
        if (dist <= 1) { startCombat(e); return; }

        let steps = e.agi;
        while(steps > 0) {
            let dx = Math.sign(target.x - e.x);
            let dy = Math.sign(target.y - e.y);
            let nx = e.x + (dx !== 0 ? dx : 0);
            let ny = e.y + (dx === 0 ? dy : 0);

            if (state.grid[ny] && state.grid[ny][nx]) {
                let cell = state.grid[ny][nx];
                if (cell.building === 'wall_wood') { cell.building = null; log(`👹 Враг сломал дерево!`); break; }
                else if (cell.building === 'wall_stone') {
                    let nx2 = e.x; let ny2 = e.y + dy;
                    if (state.grid[ny2] && state.grid[ny2][nx2] && !state.grid[ny2][nx2].building) { e.x = nx2; e.y = ny2; steps--; }
                    else break;
                } else { e.x = nx; e.y = ny; steps--; }
            } else break;
        }
    }
}

function startCombat(enemy) {
    state.inCombat = true; state.activeEnemy = enemy;
    document.getElementById('c-enemy-name').innerText = enemy.name;
    document.getElementById('c-enemy-hp').innerText = enemy.hp;
    document.getElementById('c-player-hp').innerText = state.pawns[state.activePawn].hp;
    document.getElementById('combat-log').innerHTML = "Бой!<br>";
    openModal('combat-modal');
}

function combatAction(action) {
    let p = state.pawns[state.activePawn];
    if (action === 'flee') {
        p.hp -= 3; log("Удар в спину! -3 HP.", true);
        if (p.hp <= 0) endGame("Смерть при отступлении");
        else { closeModal('combat-modal'); state.inCombat = false; updateUI(); }
        return;
    }

    let dmg = rollD6() >= 4 ? 2 : 1;
    state.activeEnemy.hp -= dmg;
    log(`Вы ударили на ${dmg}.`, true);
    document.getElementById('c-enemy-hp').innerText = Math.max(0, state.activeEnemy.hp);

    if (state.activeEnemy.hp <= 0) {
        log("Победа!", true);
        state.enemies = state.enemies.filter(e => e !== state.activeEnemy);
        closeModal('combat-modal'); state.inCombat = false; renderGrid(); updateUI();
        return;
    }

    let eDmg = rollD6() >= 4 ? 2 : 1;
    p.hp -= eDmg;
    log(`Враг ударил на ${eDmg}.`, true);
    document.getElementById('c-player-hp').innerText = Math.max(0, p.hp);

    if (p.hp <= 0) endGame("Смерть в бою");
}

function craft(item) {
    if (state.res.copper >= 1 && state.res.wood >= 1) {
        state.res.copper -= 1; state.res.wood -= 1;
        state.pawns[state.activePawn].equip = item;
        state.ap--;
        log(`✅ Скрафчено: ${item}`);
        closeModal('craft-modal'); updateUI();
    } else log("❌ Не хватает ресурсов!");
}

function endGame(reason) {
    log(`<b style="color:red;">ИГРА ОКОНЧЕНА. ${reason}</b>`);
    currentLog.result = reason;
    allLogs.push(currentLog);
    localStorage.setItem('logs', JSON.stringify(allLogs));
    document.getElementById('game-area').style.display = 'none';
    document.getElementById('top-panel').style.display = 'none';
    document.getElementById('bottom-panel').style.display = 'none';
    alert(`Игра окончена: ${reason}`);
    location.reload();
}
</script>
