<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лукоморье: Наследие</title>
    <style>
        :root { 
            --bg: #1e272e; --panel: #2f3640; --btn: #d35400; --text: #ecf0f1; --accent: #fbc531; --danger: #e84118; 
        }
        * { box-sizing: border-box; user-select: none; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-panel { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #111; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; font-size: 12px; font-weight: bold; z-index: 1000; border-bottom: 2px solid #000; }
        .pawn-btn { background: #555; padding: 5px 10px; border-radius: 5px; cursor: pointer; border: 2px solid var(--accent); }

        /* ИГРОВОЕ ПОЛЕ */
        .game-area { position: fixed; top: 50px; bottom: 140px; left: 0; right: 0; overflow: auto; background: #000; display: flex; }
        .grid { display: grid; grid-template-columns: repeat(15, 70px); grid-template-rows: repeat(15, 70px); transform-origin: 0 0; margin: auto; }
        
        /* КЛЕТКИ */
        .cell { width: 70px; height: 70px; border: 1px solid rgba(0,0,0,0.5); cursor: pointer; position: relative; display: flex; justify-content: center; align-items: center; font-size: 40px; }
        .tile-forest { background-color: #27ae60; }
        .tile-mountain { background-color: #7f8c8d; }
        .tile-water { background-color: #2980b9; }
        .tile-base { background-color: #8e44ad; }
        
        .build-wall_wood { background-color: #a0522d; font-size: 30px; }
        .build-wall_stone { background-color: #95a5a6; font-size: 30px; }
        .build-trap { background-color: #2c3e50; font-size: 30px; }
        .build-hearth { background-color: #d35400; font-size: 30px; }
        .build-barn { background-color: #8e44ad; font-size: 30px; }
        .build-hospital { background-color: #c0392b; font-size: 30px; }
        .build-great_hearth { background-color: #f1c40f; font-size: 40px; }

        .enemy-unit { outline: 3px solid red; z-index: 5; }
        .pawn-unit { outline: 3px solid yellow; z-index: 10; }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-panel { position: fixed; bottom: 0; left: 0; right: 0; height: 140px; background: var(--panel); display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 8px; z-index: 1000; border-top: 2px solid #000; }
        .btn { background: var(--btn); color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-align: center; }
        .btn:active { background: #e67e22; }
        .btn-red { background: var(--danger); }
        .btn-green { background: #27ae60; }

        /* МОДАЛКИ */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: var(--panel); padding: 20px; border-radius: 10px; width: 100%; max-width: 350px; text-align: center; border: 2px solid var(--btn); max-height: 90vh; overflow-y: auto; }
        
        .log-box { height: 120px; overflow-y: scroll; background: #000; padding: 5px; font-size: 11px; text-align: left; margin-top: 10px; font-family: monospace; border: 1px solid #333; }
        
        /* КОЛЕСО */
        .wheel-container { position: relative; width: 200px; height: 200px; margin: 0 auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#e84118 0 45deg, #00a8ff 45deg 90deg, #4cd137 90deg 135deg, #fbc531 135deg 180deg, #9b59b6 180deg 225deg, #e67e22 225deg 270deg, #1abc9c 270deg 315deg, #34495e 315deg 360deg); border: 4px solid #fff; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .wheel-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; color: yellow; z-index: 10; text-shadow: 0 2px 2px #000; }

        /* КАРТА */
        .card-visual { width: 140px; height: 200px; margin: 15px auto; display: flex; justify-content: center; align-items: center; border: 3px solid #fff; border-radius: 8px; font-weight: bold; font-size: 18px; padding: 10px; }
    </style>
</head>
<body>

<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<div class="top-panel" id="top-panel" style="display: none;">
    <div>Ход: <span id="ui-round">1</span> (<span id="ui-season">Весна</span>)</div>
    <div>ОД: <span id="ui-ap">3</span></div>
    <div>🌲<span id="ui-wood">0</span> 🪨<span id="ui-stone">0</span> 🥩<span id="ui-meat">5</span> 🐻<span id="ui-hide">0</span> ⛏️<span id="ui-copper">0</span></div>
    <div class="pawn-btn" onclick="openPawnCard()">🧑‍🌾</div>
</div>

<!-- ИГРОВОЕ ПОЛЕ -->
<div class="game-area" id="game-area" style="display: none;">
    <div class="grid" id="grid"></div>
</div>

<!-- НИЖНЯЯ ПАНЕЛЬ -->
<div class="bottom-panel" id="bottom-panel" style="display: none;">
    <button class="btn" onclick="actionGather()">Добыть</button>
    <button class="btn" onclick="openBuildMenu()">Стройка</button>
    <button class="btn" onclick="openCraftMenu()">Крафт</button>
    <button class="btn" onclick="actionCaravan()">Караван (1🥩)</button>
    <button class="btn btn-red" onclick="nextTurn()">След. Ход</button>
    <button class="btn" style="background: #555;" onclick="location.reload()">Сдаться</button>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="modal" id="menu-modal" style="display: flex;">
    <div class="modal-content">
        <h2 style="color: var(--accent); margin-top: 0;">Лукоморье v14.0</h2>
        <p style="font-size: 12px; color: #aaa;">Полная версия (13 блоков)</p>
        <button class="btn btn-green" onclick="startGame('normal')" style="width: 100%; padding: 15px; font-size: 18px; margin-bottom: 10px;">Играть (Былина)</button>
        <button class="btn btn-red" onclick="startGame('hard')" style="width: 100%; padding: 15px; font-size: 16px; margin-bottom: 10px;">Играть (Хардкор)</button>
        <button class="btn" onclick="downloadLogs()" style="width: 100%; padding: 10px; background: #2980b9;">Скачать логи (JSON)</button>
    </div>
</div>

<!-- КАРТОЧКА ПЕШКИ -->
<div class="modal" id="pawn-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Пешка</h3>
        <p>❤️ HP: <span id="p-hp">10</span>/10</p>
        <p>⚔️ Сила: 3 | 🏹 Ловкость: 3</p>
        <p>🎒 Оружие: <span id="p-weap">Кулаки</span></p>
        <p>🩸 Травмы: <span id="p-trauma">Нет</span></p>
        <button class="btn" onclick="document.getElementById('pawn-modal').style.display='none'" style="width: 100%; padding: 10px; margin-top: 10px;">Закрыть</button>
    </div>
</div>

<!-- МЕНЮ СТРОЙКИ -->
<div class="modal" id="build-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Строительство</h3>
        <button class="btn" onclick="doBuild('wall_wood', 2, 0)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Деревянная стена (2🌲)</button>
        <button class="btn" onclick="doBuild('wall_stone', 2, 2)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Каменная стена (2🌲, 2🪨)</button>
        <button class="btn" onclick="doBuild('trap', 1, 1)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Ловушка (1🌲, 1🪨)</button>
        <button class="btn" onclick="doBuild('hearth', 0, 3)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Очаг (3🪨)</button>
        <button class="btn" onclick="doBuild('barn', 2, 1)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Амбар (2🌲, 1🪨)</button>
        <button class="btn" onclick="doBuild('hospital', 3, 2)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Лазарет (3🌲, 2🪨)</button>
        <button class="btn" id="btn-great-hearth" onclick="doBuild('great_hearth', 10, 10)" style="width: 100%; padding: 10px; margin-bottom: 5px; background: #f1c40f; color: #000;">Великий Очаг (Победа!)</button>
        <button class="btn btn-red" onclick="document.getElementById('build-modal').style.display='none'" style="width: 100%; padding: 10px; margin-top: 10px;">Отмена</button>
    </div>
</div>

<!-- МЕНЮ КРАФТА -->
<div class="modal" id="craft-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Крафт</h3>
        <button class="btn" onclick="doCraft('Копье', 1, 1, 0)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Копье (+1 Атака) (1🌲, 1⛏️)</button>
        <button class="btn" onclick="doCraft('Топор', 1, 2, 0)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Топор (+1 Урон) (1🌲, 2⛏️)</button>
        <button class="btn" onclick="doCraft('Броня', 0, 1, 2)" style="width: 100%; padding: 10px; margin-bottom: 5px;">Броня (+3 HP) (2🐻, 1⛏️)</button>
        <button class="btn btn-red" onclick="document.getElementById('craft-modal').style.display='none'" style="width: 100%; padding: 10px; margin-top: 10px;">Отмена</button>
    </div>
</div>

<!-- КОЛЕСО -->
<div class="modal" id="wheel-modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--accent);">Событие</h3>
        <div class="wheel-container">
            <div class="wheel-arrow">▼</div>
            <div class="wheel" id="wheel"></div>
        </div>
        <button class="btn" id="spin-btn" onclick="spinWheel()" style="width: 100%; padding: 15px; margin-top: 20px;">Крутить!</button>
        <p id="wheel-text" style="font-weight: bold; color: yellow;"></p>
    </div>
</div>

<!-- КАРТА -->
<div class="modal" id="card-modal">
    <div class="modal-content">
        <h3 id="card-title" style="color: var(--accent); margin-top: 0;">Событие</h3>
        <div class="card-visual" id="card-visual">Карта</div>
        <p id="card-text"></p>
        <button class="btn" onclick="closeCard()" style="width: 100%; padding: 10px; margin-top: 10px;">Ок</button>
    </div>
</div>

<!-- БОЙ -->
<div class="modal" id="combat-modal">
    <div class="modal-content" style="border-color: var(--danger);">
        <h3 style="color: var(--danger); margin-top: 0;">Бой!</h3>
        <p>Враг HP: <span id="c-hp">6</span></p>
        <p>Ваше HP: <span id="c-php">10</span></p>
        <div class="log-box" id="c-log"></div>
        <button class="btn" onclick="combatAttack()" style="width: 100%; padding: 15px; margin-top: 10px;">Атаковать</button>
        <button class="btn btn-red" onclick="combatFlee()" style="width: 100%; padding: 10px; margin-top: 5px;">Отступить</button>
    </div>
</div>

<script>
// ================== СОСТОЯНИЕ ==================
let G = { 
    round: 1, ap: 3, season: 'Весна', diff: 'normal',
    res: { wood: 15, stone: 15, meat: 5, hide: 0, copper: 5 },
    pawn: { x: 7, y: 7, hp: 10, maxHp: 10, str: 3, agi: 3, weapon: 'Кулаки', trauma: false },
    map: [], enemies: [], buildMode: null, buildCost: {w:0, s:0}, inCombat: false, activeEnemy: null
};
const SEASONS = ['Весна', 'Лето', 'Осень', 'Зима'];
let logs = [];

function log(text) {
    logs.push(`[Ход ${G.round}] ${text}`);
}

function downloadLogs() {
    if(logs.length === 0) return alert("Сыграйте партию!");
    const data = JSON.stringify(logs, null, 2);
    const dl = document.createElement('a'); 
    dl.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(data)); 
    dl.setAttribute("download", `lukomorye_logs.json`); 
    dl.click();
}

// ================== СТАРТ ИГРЫ ==================
function startGame(diff) {
    G.diff = diff;
    document.getElementById('menu-modal').style.display = 'none';
    document.getElementById('top-panel').style.display = 'flex';
    document.getElementById('game-area').style.display = 'flex';
    document.getElementById('bottom-panel').style.display = 'grid';
    
    if(diff === 'hard') {
        document.getElementById('btn-great-hearth').innerText = "Великий Очаг (50🌲, 50🪨)";
        document.getElementById('btn-great-hearth').setAttribute('onclick', "doBuild('great_hearth', 50, 50)");
    }
    
    for(let y=0; y<15; y++) {
        let row = [];
        for(let x=0; x<15; x++) {
            let r = Math.random();
            let type = r < 0.15 ? 'mountain' : r < 0.25 ? 'water' : 'forest';
            if(x===7 && y===7) type = 'base';
            row.push({ type: type, build: null, emoji: type==='forest'?'🌲':type==='mountain'?'⛰️':type==='water'?'🌊':'🏕️' });
        }
        G.map.push(row);
    }
    updateUI(); renderMap();
    log("Игра началась.");
    
    setTimeout(() => {
        const area = document.getElementById('game-area');
        area.scrollLeft = (7 * 70) - (area.clientWidth / 2);
        area.scrollTop = (7 * 70) - (area.clientHeight / 2);
    }, 100);
}

// ================== РЕНДЕР ==================
function renderMap() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let y=0; y<15; y++) {
        for(let x=0; x<15; x++) {
            let d = document.createElement('div');
            let cell = G.map[y][x];
            d.className = `cell tile-${cell.type}`;
            
            let content = cell.emoji;
            if(cell.build === 'wall_wood') { d.className += ' build-wall_wood'; content = '🧱'; }
            if(cell.build === 'wall_stone') { d.className += ' build-wall_stone'; content = '🪨'; }
            if(cell.build === 'trap') { d.className += ' build-trap'; content = '🕳️'; }
            if(cell.build === 'hearth') { d.className += ' build-hearth'; content = '🔥'; }
            if(cell.build === 'barn') { d.className += ' build-barn'; content = '🏚️'; }
            if(cell.build === 'hospital') { d.className += ' build-hospital'; content = '⛑️'; }
            if(cell.build === 'great_hearth') { d.className += ' build-great_hearth'; content = '🏆'; }
            
            let e = G.enemies.find(en => en.x === x && en.y === y);
            if(e) { content = '🐺'; d.className += ' enemy-unit'; }
            if(G.pawn.x === x && G.pawn.y === y) { content = '🧑‍🌾'; d.className += ' pawn-unit'; }
            
            d.innerText = content;
            d.onclick = () => handleCellClick(x, y);
            grid.appendChild(d);
        }
    }
}

function updateUI() {
    document.getElementById('ui-round').innerText = G.round;
    document.getElementById('ui-season').innerText = G.season;
    document.getElementById('ui-ap').innerText = G.ap;
    document.getElementById('ui-wood').innerText = G.res.wood;
    document.getElementById('ui-stone').innerText = G.res.stone;
    document.getElementById('ui-meat').innerText = G.res.meat;
    document.getElementById('ui-hide').innerText = G.res.hide;
    document.getElementById('ui-copper').innerText = G.res.copper;
}

// ================== ДВИЖЕНИЕ (BFS) ==================
async function handleCellClick(tx, ty) {
    if(G.inCombat) return;
    if(G.buildMode) { placeBuild(tx, ty); return; }
    
    if(G.enemies.length > 0 && G.ap <= 0) return alert("В боевом режиме нет ОД!");
    if(G.map[ty][tx].build) return alert("Там постройка!");
    if(G.enemies.some(e => e.x === tx && e.y === ty)) return alert("Там враг!");
    
    let path = findPath(G.pawn.x, G.pawn.y, tx, ty);
    if(path.length === 0) return alert("Путь заблокирован!");
    if(G.enemies.length > 0) G.ap--;
    updateUI();
    
    for(let step of path) {
        G.pawn.x = step.x; G.pawn.y = step.y;
        renderMap();
        await new Promise(r => setTimeout(r, 120));
    }
}

function findPath(sx, sy, tx, ty) {
    let queue = [{x:sx, y:sy, path:[]}];
    let visited = new Set([`${sx},${sy}`]);
    while(queue.length > 0) {
        let cur = queue.shift();
        if(cur.x === tx && cur.y === ty) return cur.path;
        for(let d of [{x:0,y:1},{x:0,y:-1},{x:1,y:0},{x:-1,y:0}]) {
            let nx = cur.x + d.x, ny = cur.y + d.y;
            if(nx>=0 && nx<15 && ny>=0 && ny<15 && !visited.has(`${nx},${ny}`)) {
                if(!G.map[ny][nx].build && !G.enemies.some(e => e.x===nx && e.y===ny)) {
                    visited.add(`${nx},${ny}`);
                    queue.push({x:nx, y:ny, path:[...cur.path, {x:nx, y:ny}]});
                }
            }
        }
    }
    return [];
}

// ================== ДЕЙСТВИЯ ==================
function actionGather() {
    if(G.ap <= 0) return alert("Нет ОД!");
    let t = G.map[G.pawn.y][G.pawn.x].type;
    if(t === 'forest') { G.res.wood += 2; log("Собрано 2 дерева."); }
    else if(t === 'mountain') { G.res.stone += 2; G.res.copper += 1; log("Собрано 2 камня, 1 медь."); }
    else if(t === 'water') { G.res.meat += 2; log("Поймана рыба (+2 еды)."); }
    else return alert("Тут нечего добывать!");
    G.ap--; updateUI();
}

function actionCaravan() {
    if(G.ap < 1) return alert("Нет ОД!");
    if(G.res.meat < 1) return alert("Нужна 1 еда!");
    G.ap--; G.res.meat--;
    let r = Math.floor(Math.random()*6)+1;
    if(r >= 4) { G.res.copper += 2; log("Караван принес 2 меди."); alert("Караван вернулся с медью! +2 ⛏️"); }
    else { log("Караван потерял еду."); alert("Караван попал в засаду."); }
    updateUI();
}

function openBuildMenu() { document.getElementById('build-modal').style.display = 'flex'; }
function openCraftMenu() { document.getElementById('craft-modal').style.display = 'flex'; }

function doBuild(type, costW, costS) {
    if(G.ap <= 0) return alert("Нет ОД!");
    if(G.res.wood < costW || G.res.stone < costS) return alert("Не хватает ресурсов!");
    G.buildMode = type; G.buildCost.w = costW; G.buildCost.s = costS;
    document.getElementById('build-modal').style.display = 'none';
}

function placeBuild(x, y) {
    if(G.map[y][x].build) return alert("Уже занято!");
    if(G.res.wood < G.buildCost.w || G.res.stone < G.buildCost.s) return alert("Не хватает ресурсов!");
    G.res.wood -= G.buildCost.w; G.res.stone -= G.buildCost.s;
    G.map[y][x].build = G.buildMode;
    G.ap--; log(`Построено: ${G.buildMode}`);
    
    if(G.buildMode === 'great_hearth') {
        alert("ВЫ ПОБЕДИЛИ! Великий Очаг построен.");
        log("ПОБЕДА. Построен Великий Очаг.");
        downloadLogs();
        location.reload();
    }
    
    G.buildMode = null;
    updateUI(); renderMap();
}

function doCraft(item, costW, costC, costH) {
    if(G.res.wood < costW || G.res.copper < costC || G.res.hide < costH) return alert("Не хватает ресурсов!");
    G.res.wood -= costW; G.res.copper -= costC; G.res.hide -= costH;
    
    if(item === 'Броня') {
        G.pawn.maxHp += 3; G.pawn.hp += 3;
    } else {
        G.pawn.weapon = item; 
    }
    
    log(`Скрафчено: ${item}`);
    updateUI(); document.getElementById('craft-modal').style.display = 'none';
    alert(`Скрафчено: ${item}!`);
}

function openPawnCard() {
    document.getElementById('p-hp').innerText = G.pawn.hp;
    document.getElementById('p-weap').innerText = G.pawn.weapon;
    document.getElementById('p-trauma').innerText = G.pawn.trauma ? "Кровотечение!" : "Нет";
    document.getElementById('pawn-modal').style.display = 'flex';
}

// ================== КОНЕЦ ХОДА И СОБЫТИЯ ==================
function nextTurn() {
    if(G.inCombat) return;
    
    // Голод
    if(G.res.meat > 0) G.res.meat--;
    else { G.pawn.hp -= 2; log("Голод! -2 HP"); alert("Голод! -2 HP"); }
    
    // Зима
    if(G.season === 'Зима' && G.map[7][7].build !== 'hearth') { 
        G.pawn.hp -= 2; log("Мороз! Нет очага. -2 HP"); alert("Мороз! -2 HP"); 
    }
    
    // Кровотечение (травма)
    if(G.pawn.trauma) {
        G.pawn.hp -= 1; log("Кровотечение. -1 HP");
    }
    
    if(G.pawn.hp <= 0) return gameOver("Смерть от голода/холода/ран.");
    
    G.round++;
    if(G.round % 4 === 1 && G.round > 1) {
        let idx = SEASONS.indexOf(G.season);
        G.season = SEASONS[(idx + 1) % 4];
        log(`Сезон сменился на ${G.season}.`);
    }
    
    G.ap = 3; updateUI();
    document.getElementById('wheel-modal').style.display = 'flex';
    document.getElementById('wheel').style.transform = 'rotate(0deg)';
    document.getElementById('wheel-text').innerText = '';
    document.getElementById('spin-btn').style.display = 'block';
}

function spinWheel() {
    document.getElementById('spin-btn').style.display = 'none';
    let spin = 1440 + Math.floor(Math.random() * 360);
    document.getElementById('wheel').style.transform = `rotate(${spin}deg)`;
    
    setTimeout(() => {
        let s = Math.floor(Math.random()*8);
        let text = "";
        if(s === 0) { text = "Рейд!"; log("Событие: Рейд."); spawnEnemy(); }
        else if(s === 1) { text = "Удачная охота"; G.res.meat+=3; G.res.hide+=1; log("Событие: Удачная охота (+3🥩, +1🐻)."); }
        else if(s === 2) { text = "Ресурсы"; G.res.wood+=2; G.res.stone+=2; log("Событие: Найдены ресурсы."); }
        else if(s === 3) { text = "Болезнь"; G.pawn.hp-=2; log("Событие: Болезнь (-2HP)."); }
        else if(s === 4) { text = "Тишина"; log("Событие: Тишина."); }
        else if(s === 5) { text = "Обмен"; G.res.wood+=5; G.res.meat=Math.max(0, G.res.meat-2); log("Событие: Обмен."); }
        else if(s === 6) { text = "Клад"; G.res.copper+=3; log("Событие: Клад (+3⛏️)."); }
        else { text = "Воры"; G.res.wood=Math.max(0, G.res.wood-3); log("Событие: Воры (-3🌲)."); }
        
        document.getElementById('wheel-text').innerText = text;
        updateUI();
        
        setTimeout(() => { 
            document.getElementById('wheel-modal').style.display = 'none'; 
            moveEnemies();
        }, 2000);
    }, 3000);
}

// ================== ВРАГИ И БОЙ ==================
function spawnEnemy() {
    let side = Math.floor(Math.random()*4);
    let x = side===0||side===2 ? Math.floor(Math.random()*15) : (side===1?14:0);
    let y = side===0 ? 0 : (side===2 ? 14 : Math.floor(Math.random()*15));
    G.enemies.push({ x: x, y: y, hp: 6, maxHp: 6 });
}

function moveEnemies() {
    for(let e of G.enemies) {
        let dx = Math.sign(G.pawn.x - e.x); let dy = Math.sign(G.pawn.y - e.y);
        let nx = e.x + (dx !== 0 ? dx : 0); let ny = e.y + (dy === 0 ? dy : 0);
        
        if(G.map[ny][nx].build === 'wall_wood') { G.map[ny][nx].build = null; log("Враг сломал деревянную стену."); }
        else if (G.map[ny][nx].build === 'wall_stone') { /* Обход */ }
        else if (G.map[ny][nx].build === 'trap') { G.map[ny][nx].build = null; e.hp -= 3; log("Враг наступил на ловушку."); alert("Враг наступил на ловушку! -3 HP"); }
        else { e.x = nx; e.y = ny; }
        
        if(e.x === G.pawn.x && e.y === G.pawn.y) { startCombat(e); return; }
    }
    renderMap();
}

function startCombat(enemy) {
    G.inCombat = true; G.activeEnemy = enemy;
    document.getElementById('c-hp').innerText = enemy.hp;
    document.getElementById('c-php').innerText = G.pawn.hp;
    document.getElementById('c-log').innerHTML = "Враг атакует!<br>";
    log("Начался бой.");
    document.getElementById('combat-modal').style.display = 'flex';
}

function combatAttack() {
    let pRoll = Math.floor(Math.random()*6) + G.pawn.str;
    let eRoll = Math.floor(Math.random()*6) + 2; // Базовая атака врага
    let dmg = 2;
    
    // Учет оружия
    if(G.pawn.weapon === 'Копье') pRoll += 1;
    if(G.pawn.weapon === 'Топор') dmg += 1;
    
    let logBox = document.getElementById('c-log');
    
    if(pRoll >= eRoll) {
        // Игрок попал
        G.activeEnemy.hp -= dmg; 
        logBox.innerHTML += `Вы бьете (${pRoll} vs ${eRoll}). -${dmg} HP.<br>`;
        log(`В бою: попали на ${dmg}.`);
    } else {
        // Враг попал
        G.pawn.hp -= 2; 
        logBox.innerHTML += `Враг бьет (${eRoll} vs ${pRoll}). -2 HP.<br>`;
        log(`В бою: получили 2 урона.`);
        
        // Шанс на кровотечение
        if(Math.random() < 0.2) {
            G.pawn.trauma = true;
            logBox.innerHTML += `Вы получили кровотечение!<br>`;
            log("Получено кровотечение.");
        }
    }
    
    document.getElementById('c-hp').innerText = Math.max(0, G.activeEnemy.hp);
    document.getElementById('c-php').innerText = Math.max(0, G.pawn.hp);
    updateUI();
    
    if(G.activeEnemy.hp <= 0) {
        logBox.innerHTML += "Враг мертв!<br>"; log("Враг убит.");
        G.enemies = G.enemies.filter(e => e !== G.activeEnemy);
        setTimeout(() => { document.getElementById('combat-modal').style.display = 'none'; G.inCombat = false; renderMap(); }, 1000);
    } else if(G.pawn.hp <= 0) { gameOver("Смерть в бою."); }
}

function combatFlee() {
    G.pawn.hp -= 3; log("Отступили из боя (-3HP).");
    document.getElementById('combat-modal').style.display = 'none'; G.inCombat = false;
    alert("Вы сбежали, но получили удар в спину (-3 HP).");
    if(G.pawn.hp <= 0) gameOver("Смерть при отступлении.");
}

function gameOver(reason) {
    alert("ИГРА ОКОНЧЕНА: " + reason);
    log("КОНЕЦ ИГРЫ. " + reason);
    downloadLogs();
    location.reload();
}
</script>
