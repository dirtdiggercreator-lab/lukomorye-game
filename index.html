<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лукоморье: Наследие</title>
    <style>
        body { font-family: monospace; background: #2c3e50; color: #ecf0f1; padding: 5px; margin: 0; touch-action: manipulation; }
        .panel { background: #34495e; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        button { background: #e67e22; color: white; border: none; padding: 12px; margin: 2px; border-radius: 5px; font-family: monospace; cursor: pointer; font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 5px;}
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: monospace; background: #fff; color: #000; }
        
        .file-row { background: #2c3e50; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #555; }
        .file-name { font-size: 10px; color: #aaa; margin-bottom: 5px; word-break: break-all; }
        .upload-status { font-size: 12px; margin-top: 10px; color: #f1c40f; word-break: break-all;}
    </style>
</head>
<body>

<div class="panel" id="start-screen">
    <h2>Лукоморье: Наследие</h2>
    <p>Прототип (v3.4).</p>
    <button onclick="alert('Игра в разработке')">Начать новую партию (Игра)</button>
    <button onclick="requestUpload()" style="background:#2980b9;">Загрузить картинки в репозиторий</button>
    <button onclick="downloadLogs()">Скачать все логи (JSON)</button>
    <p id="log-count"></p>
</div>

<div id="upload-screen" style="display:none;">
    <div class="panel">
        <h3>Загрузка файлов</h3>
        <div id="token-section">
            <p style="font-size:12px;">Введите ваш GitHub Token:</p>
            <input type="password" id="token-input" placeholder="ghp_...">
            <button onclick="saveToken()" style="background:#27ae60;">Сохранить токен</button>
        </div>

        <div id="upload-section" style="display:none;">
            <p style="font-size:12px;">Выберите картинки (можно несколько):</p>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFileSelect(event)">
            
            <div id="file-list" style="margin-top: 10px;"></div>
            
            <button onclick="uploadFiles()" style="background:#d35400;" id="btn-upload" disabled>Загрузить в GitHub</button>
            <div class="upload-status" id="upload-status"></div>
        </div>
        <button onclick="backToMenu()" style="background:#c0392b; margin-top:20px;">Назад в меню</button>
    </div>
</div>

<script>
let allMatchLogs = JSON.parse(localStorage.getItem('lukomorye_logs') || '[]');
document.getElementById('log-count').innerText = 'Сохранено партий: ' + allMatchLogs.length;
function downloadLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allMatchLogs, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "lukomorye_test_logs.json");
    dlAnchorElem.click();
}

function requestUpload() {
    let pin = prompt("Введите PIN-код:");
    if (pin === "1337") {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('upload-screen').style.display = 'block';
        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) {
            document.getElementById('token-section').style.display = 'none';
            document.getElementById('upload-section').style.display = 'block';
        } else {
            document.getElementById('token-section').style.display = 'block';
        }
    } else if (pin !== null) alert("Неверный PIN!");
}

function saveToken() {
    const token = document.getElementById('token-input').value.trim();
    if (token.startsWith('ghp_')) {
        localStorage.setItem('gh_token', token);
        document.getElementById('token-section').style.display = 'none';
        document.getElementById('upload-section').style.display = 'block';
    } else alert("Токен должен начинаться с 'ghp_'");
}

let selectedFiles = [];
function handleFileSelect(event) {
    selectedFiles = Array.from(event.target.files);
    const listDiv = document.getElementById('file-list');
    listDiv.innerHTML = '';
    document.getElementById('btn-upload').disabled = false;

    const predefinedNames = [
        { value: 'forest.jpg', label: 'Лес (forest.jpg)' },
        { value: 'mountain.jpg', label: 'Горы (mountain.jpg)' },
        { value: 'water.jpg', label: 'Вода (water.jpg)' },
        { value: 'base.jpg', label: 'База (base.jpg)' },
        { value: 'wolf.jpg', label: 'Волк (wolf.jpg)' },
        { value: 'bear.jpg', label: 'Медведь (bear.jpg)' },
        { value: 'robber.jpg', label: 'Разбойник (robber.jpg)' }
    ];

    selectedFiles.forEach((file, index) => {
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `
            <div class="file-name">${file.name}</div>
            <select id="name-select-${index}" style="margin-bottom:5px;">
                <option value="">-- Выберите имя --</option>
                ${predefinedNames.map(n => `<option value="${n.value}">${n.label}</option>`).join('')}
                <option value="custom">-- Свое имя --</option>
            </select>
            <input type="text" id="name-input-${index}" placeholder="Свое имя (например, hero.jpg)" style="display:none; margin-bottom:0;">
        `;
        listDiv.appendChild(row);
        
        const select = document.getElementById(`name-select-${index}`);
        const input = document.getElementById(`name-input-${index}`);
        select.onchange = () => {
            input.style.display = select.value === 'custom' ? 'block' : 'none';
        };
    });
}

function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 1024;
                let width = img.width, height = img.height;
                if (width > maxWidth) {
                    height = Math.round((maxWidth / width) * height);
                    width = maxWidth;
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                    const fileReader = new FileReader();
                    fileReader.onloadend = () => resolve(fileReader.result.split(',')[1]);
                    fileReader.readAsDataURL(blob);
                }, 'image/jpeg', 0.75);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

async function uploadFiles() {
    const statusDiv = document.getElementById('upload-status');
    const token = localStorage.getItem('gh_token');
    const btn = document.getElementById('btn-upload');
    
    if (!selectedFiles.length) return;
    btn.disabled = true;
    statusDiv.innerHTML = "Начинаю загрузку...";

    const owner = "dirtdiggercreator-lab";
    const repo = "lukomorye-game";
    const branch = "master";

    for (let i = 0; i < selectedFiles.length; i++) {
        let fileName = document.getElementById(`name-select-${i}`).value;
        if (fileName === 'custom') {
            fileName = document.getElementById(`name-input-${i}`).value.trim();
        }
        if (!fileName) {
            statusDiv.innerHTML += `<br>❌ ${selectedFiles[i].name}: имя не выбрано, пропуск.`;
            continue;
        }
        if (!fileName.endsWith('.jpg')) fileName += '.jpg';

        statusDiv.innerHTML += `<br>Обработка: ${fileName}...`;
        const base64Data = await compressImage(selectedFiles[i]);
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`;
        
        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Upload ${fileName}`, content: base64Data, branch: branch })
            });
            if (response.ok) statusDiv.innerHTML += ' ✅';
            else {
                const err = await response.json();
                statusDiv.innerHTML += ` ❌ ${err.message}`;
            }
        } catch (error) {
            statusDiv.innerHTML += ` ❌ Сеть`;
        }
    }
    statusDiv.innerHTML += '<br><b>Готово!</b>';
    btn.disabled = false;
}

function backToMenu() {
    document.getElementById('upload-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
}
</script>
</body>
</html>
