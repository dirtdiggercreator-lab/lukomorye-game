<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лукоморье: Наследие</title>
    <style>
        :root { 
            --bg: #1e272e; --panel: #2f3640; --btn: #d35400; --btn-hover: #e67e22; --text: #d2dae2; --accent: #fbc531; --danger: #e84118; --success: #4cd137;
            /* Переменные для картинок, которые загрузятся из галереи */
            --tile-land: none;
            --tile-chars1: none;
            --tile-chars2: none;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* Верхняя панель */
        .top-panel { background: #151b20; padding: 5px; display: flex; flex-direction: column; border-bottom: 2px solid #000; z-index: 100; flex-shrink: 0; }
        .res-bar { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; padding: 2px 10px; }
        .pawn-bar { display: flex; justify-content: center; gap: 10px; padding: 5px 0; border-top: 1px solid #2f3640; }
        .pawn-icon { font-size: 24px; cursor: pointer; padding: 2px; border-radius: 5px; }
        .pawn-icon.active { background: var(--accent); color: #000; }
        
        /* Игровая зона со свайпом */
        .game-area { flex-grow: 1; overflow: auto; position: relative; display: flex; justify-content: center; align-items: flex-start; background: #000; touch-action: pan-x pan-y; }
        .viewport { width: 1500px; height: 1500px; transform-origin: 0 0; }
        .grid { display: grid; grid-template-columns: repeat(15, 1fr); width: 100%; height: 100%; }
        
        .cell { background-color: #27ae60; border: 1px solid rgba(0,0,0,0.4); box-sizing: border-box; cursor: pointer; position: relative; background-size: 500% 500%; background-position: 0% 0%; }
        
        /* Нарезка ландшафта (5х5) */
        .tile-forest { background-image: var(--tile-land); background-position: 0% 0%; }
        .tile-mountain { background-image: var(--tile-land); background-position: 25% 20%; }
        .tile-water { background-image: var(--tile-land); background-position: 25% 40%; }
        .tile-base { background-image: var(--tile-land); background-position: 0% 20%; }
        
        /* Нарезка построек (из той же картинки 5х5) */
        .tile-wall-wood { background-image: var(--tile-land); background-position: 75% 80%; }
        .tile-wall-stone { background-image: var(--tile-land); background-position: 100% 40%; }
        .tile-trap { background-image: var(--tile-land); background-position: 0% 80%; } /* Хворост */

        /* Пешки (из второй картинки 3х3) */
        .pawn { background-image: var(--tile-chars1); background-size: 300% 300%; background-position: 0% 0%; outline: 3px solid var(--accent); z-index: 10; }
        
        /* Враги (из второй/третьей картинки 3х3) */
        .enemy { background-image: var(--tile-chars1); background-size: 300% 300%; background-position: 100% 0%; outline: 2px solid var(--danger); z-index: 5; }
        
        /* Кнопки зума */
        .zoom-controls { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 50; }
        .zoom-btn { background: rgba(0,0,0,0.6); color: white; border: 1px solid #555; border-radius: 5px; width: 35px; height: 35px; font-size: 20px; cursor: pointer; }

        /* Нижняя панель (2 колонки) */
        .bottom-panel { background: var(--panel); padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 2px solid #000; z-index: 100; flex-shrink: 0; }
        .btn { background: var(--btn); color: white; border: none; padding: 12px 5px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn:disabled { background: #555; color: #888; }
        .btn-danger { background: var(--danger); }
        .btn-full { grid-column: span 2; }
        
        /* Модалки */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--panel); padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; border: 2px solid var(--btn); max-height: 90vh; overflow-y: auto; }
        
        /* Колесо */
        .wheel { width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(#e84118 0deg 45deg, #00a8ff 45deg 90deg, #4cd137 90deg 135deg, #fbc531 135deg 180deg, #9b59b6 180deg 225deg, #e67e22 225deg 270deg, #1abc9c 270deg 315deg, #34495e 315deg 360deg); margin: 20px auto; border: 4px solid #fff; position: relative; transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1); }
        .wheel-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; color: #fff; text-shadow: 0 2px 5px #000; z-index: 2;}

        .log-box { height: 80px; overflow-y: scroll; background: #000; padding: 5px; font-size: 10px; font-family: monospace; border-radius: 5px; text-align: left; margin-top: 10px; }
        input[type="file"] { display: none; }
        .upload-btn { background: #00a8ff; margin-bottom: 10px; display: block; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-sizing: border-box;}
    </style>
</head>
<body>

<div class="top-panel" id="top-panel" style="display:none;">
    <div class="res-bar">
        <div>Раунд: <span id="ui-round">1</span></div>
        <div>❤️ <span id="ui-hp">10</span>/<span id="ui-maxhp">10</span></div>
        <div>⚡ <span id="ui-ap">3</span></div>
        <div>🌲<span id="ui-wood">0</span> 🪨<span id="ui-stone">0</span> 🥩<span id="ui-meat">2</span> ⛏️<span id="ui-copper">0</span></div>
    </div>
    <div class="pawn-bar" id="pawn-bar"></div>
</div>

<div class="game-area" id="game-area" style="display:none;">
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomMap(1.2)">+</button>
        <button class="zoom-btn" onclick="zoomMap(0.8)">-</button>
    </div>
    <div class="viewport" id="viewport">
        <div class="grid" id="game-grid"></div>
    </div>
</div>

<div class="bottom-panel" id="bottom-panel" style="display:none;">
    <button class="btn" onclick="setMode('move')">Движение</button>
    <button class="btn" onclick="openModal('build-modal')">Стройка</button>
    <button class="btn" onclick="openModal('craft-modal')">Крафт</button>
    <button class="btn" onclick="doAction('gather')">Добыть</button>
    <button class="btn" onclick="sendCaravan()">Караван</button>
    <button class="btn btn-danger" onclick="nextRound()">Следующий ход</button>
    <button class="btn btn-full" onclick="endGame('Вы сдались')" style="background: #7f8c8d;">Сдаться / В меню</button>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="modal" id="main-menu-modal" style="display:flex;">
    <div class="modal-content">
        <h2 style="color: var(--accent); margin-top: 0; font-size: 28px;">Лукоморье</h2>
        
        <button class="btn btn-full" onclick="openModal('diff-modal')" style="padding: 15px; font-size: 16px; margin-bottom: 10px;">Начать новую игру</button>
        <button class="btn btn-full" onclick="openModal('settings-modal')" style="padding: 15px; font-size: 16px; background: #8e44ad; margin-bottom: 10px;">Загрузить графику</button>
        <button class="btn btn-full" onclick="downloadLogs()" style="padding: 15px; font-size: 16px; background: #7f8c8d;">Скачать логи</button>
    </div>
</div>

<!-- ЭКРАН ЗАГРУЗКИ ГРАФИКИ -->
<div class="modal" id="settings-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Графика игры</h3>
        <p style="font-size: 12px; color: #aaa;">Загрузите 3 картинки из галереи. Они сохранятся в памяти браузера.</p>
        
        <label class="upload-btn">
            1. Ландшафт (5x5)
            <input type="file" id="upload-land" onchange="handleImageUpload(event, 'tile-land')">
        </label>
        <label class="upload-btn" style="background: #27ae60;">
            2. Персонажи (3x3)
            <input type="file" id="upload-chars1" onchange="handleImageUpload(event, 'tile-chars1')">
        </label>
        <label class="upload-btn" style="background: #d35400;">
            3. Враги (3x3)
            <input type="file" id="upload-chars2" onchange="handleImageUpload(event, 'tile-chars2')">
        </label>

        <button class="btn btn-full" onclick="closeModal('settings-modal')" style="margin-top: 15px; background: #555;">Готово</button>
    </div>
</div>

<!-- ВЫБОР СЛОЖНОСТИ -->
<div class="modal" id="diff-modal">
    <div class="modal-content">
        <h3 style="color: var(--accent); margin-top: 0;">Сложность</h3>
        <button class="btn btn-full" onclick="initGame('easy')" style="background: #27ae60; margin-bottom: 10px;">Сказка</button>
        <button class="btn btn-full" onclick="initGame('normal')" style="background: var(--btn); margin-bottom: 10px;">Былина</button>
        <button class="btn btn-full" onclick="initGame('hard')" style="background: #c0392b; margin-bottom: 10px;">Темное Время</button>
        <button class="btn btn-full" onclick="closeModal('diff-modal')" style="background: #555;">Назад</button>
    </div>
</div>

<!-- КОЛЕСО -->
<div class="modal" id="wheel-modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--accent);">Колесо Событий</h3>
        <div style="position: relative; width: 200px; margin: 0 auto;">
            <div class="wheel-arrow">▼</div>
            <div class="wheel" id="wheel-visual"></div>
        </div>
        <button class="btn btn-full" id="btn-spin" onclick="spinWheel()" style="margin-top: 20px;">Крутить!</button>
        <p id="wheel-result" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
</div>

<!-- БОЙ -->
<div class="modal" id="combat-modal">
    <div class="modal-content" style="border-color: var(--danger);">
        <h3 style="color: var(--danger); margin-top: 0;">БОЙ!</h3>
        <p>Враг: <span id="c-enemy-name">Медведь</span></p>
        <p>HP Врага: <span id="c-enemy-hp">4</span></p>
        <p>Твое HP: <span id="c-player-hp">10</span></p>
        <div class="log-box" id="combat-log" style="height: 80px; margin-bottom: 10px;"></div>
        <button class="btn btn-full" onclick="combatAction('attack')" style="margin-bottom: 5px;">Атаковать</button>
        <button class="btn btn-full" onclick="combatAction('flee')" style="background: #c0392b;">Отступить</button>
    </div>
</div>

<script>
// ================== ЗАГРУЗКА ГРАФИКИ ==================
function handleImageUpload(event, cssVarName) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const base64 = e.target.result;
        localStorage.setItem(cssVarName, base64);
        document.documentElement.style.setProperty(`--${cssVarName}`, `url(${base64})`);
        alert("Картинка загружена и сохранена!");
    };
    reader.readAsDataURL(file);
}

// Загрузка сохраненных картинок при старте
window.onload = () => {
    ['tile-land', 'tile-chars1', 'tile-chars2'].forEach(key => {
        const saved = localStorage.getItem(key);
        if (saved) document.documentElement.style.setProperty(`--${key}`, `url(${saved})`);
    });
};

// ================== УТИЛИТЫ ==================
let currentLog = { actions: [], result: "in_progress" };
let allLogs = JSON.parse(localStorage.getItem('logs') || '[]');
function downloadLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allLogs, null, 2));
    const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "logs.json"); dl.click();
}
function log(msg) { currentLog.actions.push(`[R${state.round}] ${msg}`); }
function rollD6() { return Math.floor(Math.random() * 6) + 1; }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// ================== ЗУМ И СВАЙП ==================
let currentScale = 1;
const viewport = document.getElementById('viewport');
const gameArea = document.getElementById('game-area');

function zoomMap(factor) {
    currentScale *= factor;
    if (currentScale < 0.5) currentScale = 0.5;
    if (currentScale > 2) currentScale = 2;
    viewport.style.transform = `scale(${currentScale})`;
}

let touchStartDist = 0; let touchStartScale = 1;
gameArea.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        touchStartDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        touchStartScale = currentScale;
    }
});
gameArea.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        const factor = dist / touchStartDist;
        currentScale = touchStartScale * factor;
        if (currentScale < 0.5) currentScale = 0.5;
        if (currentScale > 2) currentScale = 2;
        viewport.style.transform = `scale(${currentScale})`;
    }
}, { passive: false });

// ================== ИГРА ==================
let state = {};
function initGame(difficulty) {
    closeModal('diff-modal'); closeModal('main-menu-modal');
    state = {
        round: 1, ap: 3, maxHp: 10, hp: 10,
        res: { wood: 0, stone: 0, meat: 2, hide: 0, copper: 0 },
        grid: [], enemies: [], mode: 'move',
        inCombat: false, activeEnemy: null, isAnimating: false,
        pawns: [{ name: "Ратмир", x: 7, y: 7, hp: 10 }],
        activePawn: 0
    };
    currentLog = { actions: [], result: "in_progress" };
    for (let y = 0; y < 15; y++) {
        let row = [];
        for (let x = 0; x < 15; x++) {
            let type = Math.random() < 0.2 ? "mountain" : Math.random() < 0.15 ? "water" : "forest";
            if (x === 7 && y === 7) type = "base";
            row.push({ type, building: null });
        }
        state.grid.push(row);
    }
    document.getElementById('top-panel').style.display = 'flex';
    document.getElementById('game-area').style.display = 'flex';
    document.getElementById('bottom-panel').style.display = 'grid';
    renderGrid(); updateUI();
    
    // Центрируем на игроке
    setTimeout(() => {
        gameArea.scrollLeft = (7 * 100) - (gameArea.clientWidth / 2);
        gameArea.scrollTop = (7 * 100) - (gameArea.clientHeight / 2);
    }, 100);
}

function renderGrid() {
    const gridDiv = document.getElementById('game-grid');
    gridDiv.innerHTML = '';
    for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
            const cell = state.grid[y][x];
            const d = document.createElement('div');
            d.className = `cell tile-${cell.type}`;
            
            if (cell.building === 'wall_wood') d.className = 'cell tile-wall-wood';
            else if (cell.building === 'wall_stone') d.className = 'cell tile-wall-stone';
            else if (cell.building === 'trap') d.className = 'cell tile-trap';

            let enemyHere = state.enemies.find(e => e.x === x && e.y === y);
            if (enemyHere) d.className = 'cell enemy';

            let pawnHere = state.pawns.find(p => p.x === x && p.y === y);
            if (pawnHere) d.className = 'cell pawn';

            d.onclick = () => handleCellClick(x, y); 
            gridDiv.appendChild(d);
        }
    }
    renderPawnBar();
}

function renderPawnBar() {
    const bar = document.getElementById('pawn-bar');
    bar.innerHTML = '';
    state.pawns.forEach((p, i) => {
        const d = document.createElement('div');
        d.className = `pawn-icon ${i === state.activePawn ? 'active' : ''}`;
        d.innerText = '🧑‍🌾';
        bar.appendChild(d);
    });
}

function updateUI() {
    document.getElementById('ui-round').innerText = state.round;
    document.getElementById('ui-hp').innerText = state.pawns[state.activePawn].hp;
    document.getElementById('ui-ap').innerText = state.ap;
    document.getElementById('ui-wood').innerText = state.res.wood;
    document.getElementById('ui-stone').innerText = state.res.stone;
    document.getElementById('ui-meat').innerText = state.res.meat;
}

// ================== ХОДЬБА ==================
async function handleCellClick(x, y) {
    if (state.inCombat || state.isAnimating) return;
    let p = state.pawns[state.activePawn];
    if (p.x === x && p.y === y) return;
    if (state.grid[y][x].building) return alert("Клетка занята!");
    
    state.isAnimating = true;
    let path = findPath(p.x, p.y, x, y);
    if (path.length > 0) {
        for (let step of path) {
            p.x = step.x; p.y = step.y; renderGrid(); await sleep(200);
        }
    } else { alert("Путь заблокирован!"); }
    state.isAnimating = false;
}

function findPath(sx, sy, tx, ty) {
    let queue = [{ x: sx, y: sy, path: [] }]; let visited = new Set(); visited.add(`${sx},${sy}`);
    while (queue.length > 0) {
        let curr = queue.shift();
        if (curr.x === tx && curr.y === ty) return curr.path;
        let dirs = [{x:0,y:1},{x:0,y:-1},{x:1,y:0},{x:-1,y:0}];
        for (let d of dirs) {
            let nx = curr.x + d.x, ny = curr.y + d.y;
            if (nx>=0 && nx<15 && ny>=0 && ny<15 && !visited.has(`${nx},${ny}`)) {
                if (!state.grid[ny][nx].building && !state.enemies.some(e => e.x===nx && e.y===ny)) {
                    visited.add(`${nx},${ny}`); queue.push({ x: nx, y: ny, path: [...curr.path, {x:nx, y:ny}] });
                }
            }
        }
    }
    return [];
}

// ================== ДЕЙСТВИЯ ==================
function doAction(type) { 
    if (state.ap <= 0) return alert("Нет очков действий! Нажмите 'Следующий ход'.");
    state.ap--; alert("Действие выполнено (упрощено для теста)."); updateUI(); 
}
function sendCaravan() { 
    if (state.ap < 1 || state.res.meat < 1) return alert("Нужно 1 очко действия и 1 еда!");
    state.ap--; state.res.meat--; alert("Караван отправлен!"); updateUI(); 
}
function setMode(m) { state.mode = m; alert(`Режим: ${m}`); }

function nextRound() {
    if (state.inCombat) return;
    state.round++; state.ap = 3;
    openModal('wheel-modal'); document.getElementById('btn-spin').style.display = 'block'; document.getElementById('wheel-visual').style.transform = 'rotate(0deg)';
    updateUI();
}

function spinWheel() {
    document.getElementById('btn-spin').style.display = 'none';
    let wheel = document.getElementById('wheel-visual'); wheel.style.transform = `rotate(${1440 + Math.floor(Math.random() * 360)}deg)`;
    setTimeout(() => {
        document.getElementById('wheel-result').innerText = "Выпало событие!";
        setTimeout(() => closeModal('wheel-modal'), 1500);
    }, 3000);
}

function endGame(reason) {
    alert(`Игра окончена: ${reason}`);
    allLogs.push(currentLog);
    localStorage.setItem('logs', JSON.stringify(allLogs));
    location.reload();
}
</script>
</body>
</html>
