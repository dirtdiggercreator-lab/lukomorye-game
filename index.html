<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лукоморье: Наследие (Тест)</title>
    <style>
        body { font-family: monospace; background: #2c3e50; color: #ecf0f1; padding: 10px; margin: 0; }
        .panel { background: #34495e; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        button { background: #e67e22; color: white; border: none; padding: 10px; margin: 2px; border-radius: 5px; font-family: monospace; cursor: pointer; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 10px; }
        .cell { background: #27ae60; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 1px solid #000; cursor: pointer; }
        .cell.mountain { background: #7f8c8d; }
        .cell.water { background: #2980b9; }
        .cell.base { background: #8e44ad; }
        .cell.player { outline: 3px solid yellow; font-weight: bold; }
        .log-box { height: 150px; overflow-y: scroll; background: #000; padding: 5px; font-size: 12px; border: 1px solid #555; margin-top: 10px; }
        .stats { display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; }
        .combat-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 100; }
        .combat-modal button { width: 100%; padding: 15px; font-size: 16px; margin: 5px 0; }
        .log-list { font-size: 10px; color: #aaa; }
    </style>
</head>
<body>

<div class="panel" id="start-screen">
    <h2>Лукоморье: Наследие</h2>
    <p>Прототип (v3.0). Управление на телефоне.</p>
    <button onclick="initGame()">Начать новую партию</button>
    <button onclick="downloadLogs()">Скачать все логи (JSON)</button>
    <p id="log-count"></p>
</div>

<div id="game-screen" style="display:none;">
    <div class="panel">
        <div class="stats">
            <span>Раунд: <b id="ui-round">1</b></span>
            <span>Сезон: <b id="ui-season">Весна</b></span>
            <span>Действия: <b id="ui-ap">3</b></span>
            <span>HP: <b id="ui-hp">10</b>/<span id="ui-maxhp">10</span></span>
            <span>Угроза: <b id="ui-threat">0</b></span>
        </div>
        <div class="stats" style="margin-top:5px; font-size:12px;">
            <span>🌲 <b id="ui-wood">0</b></span>
            <span>🪨 <b id="ui-stone">0</b></span>
            <span>🥩 <b id="ui-meat">0</b></span>
            <span>🐻 <b id="ui-hide">0</b></span>
            <span>⛏️ <b id="ui-copper">0</b></span>
        </div>
    </div>

    <div class="grid" id="game-grid"></div>

    <div class="panel" id="actions-panel">
        <button onclick="doAction('gather')" id="btn-gather">Добыть (1 AP)</button>
        <button onclick="doAction('craft_spear')" id="btn-craft_spear">Копье (1⛏️1🌲)</button>
        <button onclick="doAction('craft_bow')" id="btn-craft_bow">Лук (2🌲1🐻)</button>
        <button onclick="doAction('rest')" id="btn-rest">Отдых (1 AP)</button>
        <button onclick="nextRound()" style="background:#c0392b; width:100%;">Следующий раунд</button>
    </div>
    
    <div class="log-box" id="log-box"></div>
</div>

<div class="combat-modal" id="combat-modal">
    <h2 style="color:#e74c3c;">БОЙ!</h2>
    <div id="combat-log" style="height:100px; overflow-y:scroll; width:100%; border:1px solid #555; margin-bottom:10px; padding:5px; font-size:12px;"></div>
    <div style="margin-bottom:10px;">
        <span>Враг: <b id="enemy-name"></b></span> | 
        <span>HP: <b id="enemy-hp"></b></span>
    </div>
    <button onclick="combatTurn('attack')">Атаковать (Д6 + Сила)</button>
    <button onclick="combatTurn('flee')" style="background:#c0392b;">Отступить (Удар в спину!)</button>
</div>

<script>
// ================== БАЗА ДАННЫХ И ЛОГИ ==================
let allMatchLogs = JSON.parse(localStorage.getItem('lukomorye_logs') || '[]');
let currentMatchLog = { actions: [], combat: [], result: "unknown" };
let state = {};

function updateLogCount() {
    document.getElementById('log-count').innerText = `Сохранено партий: ${allMatchLogs.length}`;
}
updateLogCount();

function saveMatchLog() {
    allMatchLogs.push(currentMatchLog);
    localStorage.setItem('lukomorye_logs', JSON.stringify(allMatchLogs));
    updateLogCount();
}

function downloadLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allMatchLogs, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "lukomorye_test_logs.json");
    dlAnchorElem.click();
}

function log(msg, isCombat = false) {
    const box = document.getElementById(isCombat ? 'combat-log' : 'log-box');
    if (box) {
        box.innerHTML += msg + '<br>';
        box.scrollTop = box.scrollHeight;
    }
    if (isCombat) currentMatchLog.combat.push(msg);
    else currentMatchLog.actions.push(`[R${state.round}] ${msg}`);
}

// ================== ИНИЦИАЛИЗАЦИЯ ==================
function initGame() {
    state = {
        round: 1, season: "Весна", ap: 3, maxHp: 10, hp: 10,
        res: { wood: 0, stone: 0, meat: 2, hide: 0, copper: 0 },
        weapon: null, shield: false, armor: false,
        playerPos: { x: 2, y: 2 },
        grid: generateGrid()
    };
    currentMatchLog = { actions: [], combat: [], result: "in_progress" };
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    document.getElementById('log-box').innerHTML = "Партия начата!<br>";
    renderGrid();
    updateUI();
    log("Игра началась. У вас 3 действия.");
}

function generateGrid() {
    let g = [];
    for (let y = 0; y < 5; y++) {
        let row = [];
        for (let x = 0; x < 5; x++) {
            let type = "forest";
            if (x === 2 && y === 2) type = "base";
            else if (Math.random() < 0.3) type = "mountain";
            else if (Math.random() < 0.2) type = "water";
            row.push({ type: type, x, y });
        }
        g.push(row);
    }
    return g;
}

function renderGrid() {
    const gridDiv = document.getElementById('game-grid');
    gridDiv.innerHTML = '';
    for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 5; x++) {
            const cell = state.grid[y][x];
            const d = document.createElement('div');
            d.className = `cell ${cell.type}`;
            if (state.playerPos.x === x && state.playerPos.y === y) {
                d.classList.add('player');
                d.innerText = "🧑‍🌾";
            } else {
                d.innerText = cell.type === 'forest' ? '🌲' : cell.type === 'mountain' ? '⛰️' : cell.type === 'water' ? '🌊' : '🏕️';
            }
            d.onclick = () => movePlayer(x, y);
            gridDiv.appendChild(d);
        }
    }
}

function movePlayer(x, y) {
    if (state.ap <= 0) return log("Нет действий для движения!");
    state.playerPos = { x, y };
    state.ap--;
    log(`Пешка переместилась на [${x},${y}].`);
    renderGrid();
    updateUI();
}

// ================== ДЕЙСТВИЯ ==================
function doAction(type) {
    if (state.ap <= 0) return log("Нет действий! Нажмите 'Следующий раунд'.");
    const p = state.playerPos;
    const cellType = state.grid[p.y][p.x].type;

    if (type === 'gather') {
        state.ap--;
        let res = rollD6() + 2; // Упрощенно +2 к ремеслу
        if (cellType === 'forest') { state.res.wood += Math.floor(res/2); log(`Собрано дерева: ${Math.floor(res/2)}`); }
        else if (cellType === 'mountain') { state.res.stone += Math.floor(res/2); log(`Собрано камня: ${Math.floor(res/2)}`); }
        else if (cellType === 'water') { state.res.meat += Math.floor(res/2); log(`Поймана рыба: ${Math.floor(res/2)}`); }
        else { log("Здесь нечего собирать."); }
    } 
    else if (type === 'craft_spear') {
        if (state.res.copper >= 1 && state.res.wood >= 1) {
            state.res.copper--; state.res.wood--; state.ap--;
            state.weapon = "spear";
            log("Скрафчено Копье (+1 к атаке, бьет первым).");
        } else log("Не хватает ресурсов!");
    }
    else if (type === 'craft_bow') {
        if (state.res.wood >= 2 && state.res.hide >= 1) {
            state.res.wood -= 2; state.res.hide--; state.ap--;
            state.weapon = "bow";
            log("Скрафчен Лук (Атака в 1-м раунде без ответа).");
        } else log("Не хватает ресурсов!");
    }
    else if (type === 'rest') {
        state.ap--;
        state.hp = Math.min(state.maxHp, state.hp + 2);
        log("Вы отдохнули (+2 HP).");
    }
    updateUI();
}

// ================== СЛЕДУЮЩИЙ РАУНД ==================
function nextRound() {
    // Еда
    if (state.res.meat >= 1) {
        state.res.meat--;
        log("Съедена 1 еда.");
    } else {
        state.hp -= 2;
        log("ГОЛОД! Вы потеряли 2 HP.");
    }

    // Проверка смерти
    if (state.hp <= 0) return endGame("Смерть от голода");

    // Смена сезона
    if (state.round % 4 === 0) {
        const seasons = ["Весна", "Лето", "Осень", "Зима"];
        let nextIdx = (seasons.indexOf(state.season) + 1) % 4;
        state.season = seasons[nextIdx];
        log(`Сезон сменился на: ${state.season}`);
        if (state.season === "Зима" && !state.armor) { // Условно, шкуры = одежда
            state.hp -= 2;
            log("ЛЕДЯНОЙ ВЕТЕР! Нет теплой одежды (-2 HP).");
        }
    }

    // Рейд (каждый четный)
    state.round++;
    if (state.round % 2 === 0) {
        let threat = 1 + Math.floor(state.round / 2) + 1; // 1 пешка
        log(`УГРОЗА ${threat}. Начинается рейд!`);
        startCombat(threat);
    } else {
        state.ap = 3;
        updateUI();
    }
}

// ================== БОЙ ==================
let currentEnemy = null;

function startCombat(threatLevel) {
    let enemy = { name: "Волк", hp: 6, atk: 2, def: 4, agi: 4 };
    if (threatLevel >= 4) enemy = { name: "Медведь", hp: 12, atk: 3, def: 4, agi: 2 };
    if (threatLevel >= 6) enemy = { name: "Костяной страж", hp: 10, atk: 2, def: 6, agi: 1 };

    currentEnemy = enemy;
    document.getElementById('enemy-name').innerText = enemy.name;
    document.getElementById('enemy-hp').innerText = enemy.hp;
    document.getElementById('combat-log').innerHTML = `<b>Появился ${enemy.name}!</b><br>`;
    document.getElementById('combat-modal').style.display = 'flex';
    
    // Инициатива
    let pInit = rollD6() + 3; // Ловкость 3
    let eInit = rollD6() + enemy.agi;
    if (pInit >= eInit) {
        log("Вы ходите первым!", true);
    } else {
        log("Враг ходит первым!", true);
        enemyAttack();
    }
}

function enemyAttack() {
    if (currentEnemy.hp <= 0 || state.hp <= 0) return;
    let roll = rollD6() + currentEnemy.atk;
    if (roll >= 4) {
        let dmg = 2;
        if (roll === 6 + currentEnemy.atk) dmg *= 2; // Крит
        state.hp -= dmg;
        log(`Враг попал! Урон: ${dmg}.`, true);
        updateUI();
    } else {
        log("Враг промахнулся.", true);
    }
}

function combatTurn(action) {
    if (action === 'flee') {
        log("Вы отступаете. Удар в спину!", true);
        let dmg = 4;
        state.hp -= dmg;
        log(`Вы получили ${dmg} урона и сбежали.`, true);
        endCombat("fled");
        return;
    }

    // Атака игрока
    let roll = rollD6() + 3; // Сила 3
    let dmg = 1;
    if (state.weapon === 'spear') roll += 1;
    if (state.weapon === 'bow') { log("Вы стреляете из лука!", true); dmg = 2; }
    
    if (roll >= currentEnemy.def) {
        if (roll === 6 + 3 + (state.weapon === 'spear' ? 1 : 0)) dmg *= 2;
        currentEnemy.hp -= dmg;
        log(`Вы попали! Урон: ${dmg}.`, true);
    } else {
        log("Вы промахнулись.", true);
    }
    document.getElementById('enemy-hp').innerText = Math.max(0, currentEnemy.hp);

    if (currentEnemy.hp <= 0) {
        log("ВРАГ ПОВЕРЖЕН!", true);
        state.res.meat += 2; state.res.hide += 2;
        endCombat("win");
        return;
    }

    // Ответ врага
    if (state.weapon !== 'bow') {
        enemyAttack();
    } else {
        log("Враг не может достать вас в 1-м раунде!", true);
        state.weapon = "spear"; // После выстрела лук становится бесполезен
    }

    if (state.hp <= 0) {
        endCombat("death");
    }
}

function endCombat(result) {
    document.getElementById('combat-modal').style.display = 'none';
    if (result === "death") {
        endGame("Смерть в бою");
    } else {
        state.ap = 3;
        updateUI();
    }
}

function endGame(reason) {
    log(`<b>ИГРА ОКОНЧЕНА. Причина: ${reason}</b>`);
    currentMatchLog.result = reason;
    saveMatchLog();
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
    updateLogCount();
}

// ================== УТИЛИТЫ ==================
function rollD6() { return Math.floor(Math.random() * 6) + 1; }

function updateUI() {
    document.getElementById('ui-round').innerText = state.round;
    document.getElementById('ui-season').innerText = state.season;
    document.getElementById('ui-ap').innerText = state.ap;
    document.getElementById('ui-hp').innerText = state.hp;
    document.getElementById('ui-maxhp').innerText = state.maxHp;
    document.getElementById('ui-wood').innerText = state.res.wood;
    document.getElementById('ui-stone').innerText = state.res.stone;
    document.getElementById('ui-meat').innerText = state.res.meat;
    document.getElementById('ui-hide').innerText = state.res.hide;
    document.getElementById('ui-copper').innerText = state.res.copper;
}
</script>
</body>
</html>
